<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>燈火｜生物渲染效能驗收</title><style>body{margin:12px;background:#142a22;color:#e7dabb;font:15px system-ui}main{max-width:960px;margin:auto}canvas{display:block;width:100%;height:auto;background:#263b31;image-rendering:pixelated;border:1px solid #8a805e}button{padding:10px;margin:8px 6px 0 0;border:1px solid #aa9b70;border-radius:6px;background:#304c3b;color:inherit;font:inherit}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid #637b69;text-align:right}td:first-child,th:first-child{text-align:left}p{line-height:1.5}a{color:inherit}</style><main><h2>生物渲染效能驗收 V1.1｜共用核心</h2><canvas id="c" width="960" height="540"></canvas><button id="run" disabled>開始測試（1／5／10／20隻）</button><button id="stop" disabled>停止</button><p id="status">載入素材…</p><table><thead><tr><th>數量</th><th>方式</th><th>平均 ms</th><th>P95 ms</th><th>觀測 FPS</th><th>快取命中</th></tr></thead><tbody id="out"></tbody></table><p>使用現有五組方向骨架、八方向映射及生活動作，搭配獨立核心模擬。每組150幀，前30幀暖機不計時間。兩模式以相同30Hz動畫取樣比較；逐隻繪製不使用整張畫格快取，共享模式最多64張，由燈火共用渲染資源管理；固定畫格邊界仍需視覺驗收。平均與P95為核心＋Canvas提交耗時，FPS為前景requestAnimationFrame間隔估計，並非GPU呈現計時。此為固定排列壓力測試，非完整戰鬥、腳掌地形IK或正式多生物場景。</p><p>建議橫式測試，保留頁面前景。<a href="./creature-performance-preview.html?v=1">核心測試</a>｜<a href="./moss-beast-v3-rig-preview.html?v=42">返回單隻測試</a></p></main><script src="./assets/creature_rig_math_v1.js?v=1"></script><script src="./assets/creature_motion_core_v1.js?v=1"></script><script src="./assets/creature_shadow_v1.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_profile.js?v=2"></script><script src="./assets/creature_mouth_v1.js?v=3"></script><script src="./assets/monsters/moss_beast_v3_mouth_profile.js?v=2"></script><script src="./assets/creature_head_v1.js?v=3"></script><script src="./assets/monsters/moss_beast_v3_head_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_front_quarter_head_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_back_head_profiles.js?v=1"></script><script src="./assets/creature_secondary_v1.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_secondary_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_directional_secondary_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_adapter.js?v=6"></script><script src="./assets/monsters/moss_beast_v3_quarter_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_quarter_mouth_profile.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_quarter_adapter.js?v=5"></script><script src="./assets/monsters/moss_beast_v3_axial_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_front_mouth_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_adapter.js?v=6"></script><script src="./assets/monsters/moss_beast_v3_rear_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_mouth_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_adapter.js?v=5"></script><script src="./assets/creature_direction_v1.js?v=3"></script><script src="./assets/creature_world_motion_v1.js?v=4"></script><script src="./assets/creature_foot_lock_v1.js?v=2"></script><script src="./assets/creature_gait_sync_v1.js?v=3"></script><script src="./assets/creature_terrain_v1.js?v=2"></script><script src="./assets/creature_environment_sense_v1.js?v=1"></script><script src="./assets/creature_perception_v1.js?v=2"></script><script src="./assets/object_stimulus_catalog_v1.js?v=1"></script><script src="./assets/creature_stimulus_v1.js?v=5"></script><script src="./assets/creature_needs_v1.js?v=2"></script><script src="./assets/creature_lifestyle_v1.js?v=3"></script><script src="./assets/creature_behavior_v1.js?v=8"></script><script src="./assets/creature_life_motion_v1.js?v=2"></script><script src="./assets/creature_status_motion_v1.js?v=1"></script><script src="./assets/creature_perf_v1.js?v=1"></script><script src="./assets/render_resources_v1.js?v=2"></script><script src="./assets/creature_render_perf_v1.js?v=2"></script><script>'use strict';
const $=id=>document.getElementById(id),ctx=$('c').getContext('2d'),R=DungeonCreatureRenderPerfV1;
const adapters={side:DungeonMossBeastV3Adapter,quarter:DungeonMossBeastV3QuarterAdapter,front:DungeonMossBeastV3Axial.front,back:DungeonMossBeastV3Axial.back,rear:DungeonMossBeastV3RearAdapter};
const head={side:DungeonMossBeastV3HeadProfile,front:DungeonMossBeastV3FrontHeadProfile,quarter:DungeonMossBeastV3QuarterHeadProfile,rear:DungeonMossBeastV3RearHeadProfile,back:DungeonMossBeastV3BackHeadProfile},jaw={side:DungeonMossBeastV3MouthProfile,front:DungeonMossBeastV3FrontMouthProfile,quarter:DungeonMossBeastV3QuarterMouthProfile,rear:DungeonMossBeastV3RearMouthProfile},secondary={side:DungeonMossBeastV3SecondaryProfile,...DungeonMossBeastV3SecondaryProfiles};
const limits=Object.fromEntries(Object.keys(adapters).map(k=>[k,{head:head[k]?.maxAngle??0,jaw:jaw[k]?.maxAngle??0,mane:secondary[k]?.maneMax??0,tail:secondary[k]?.tailMax??0}]));
let renderer=null,running=false,stop=false;const art={};
async function init(){for(const [key,i] of Object.entries({side:6,quarter:7,front:0,back:4,rear:5})){const im=new Image();im.src='./assets/monsters/v3/moss_beast_v3_'+String(i*45).padStart(3,'0')+'.png';await im.decode();art[key]=adapters[key].split(im);}renderer=R.create(adapters,art,limits);renderer.draw(ctx,1,0,false);$('run').disabled=false;$('status').textContent='素材載入完成';}
function row(values){const tr=document.createElement('tr');for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td);} $('out').append(tr);}
function summary(t){const sorted=t.slice().sort((a,b)=>a-b);return [t.reduce((a,b)=>a+b,0)/t.length,sorted[Math.ceil(t.length*.95)-1]];}
$('stop').onclick=()=>{stop=true;};$('run').onclick=async()=>{if(running||!renderer)return;running=true;stop=false;$('run').disabled=true;$('stop').disabled=false;$('out').textContent='';try{for(const count of [1,5,10,20]){for(const shared of [false,true]){if(stop)break;renderer.reset();const sim=DungeonCreaturePerfV1.create(count),times=[],intervals=[];let previous=null;for(let i=0;i<150;i++){const stamp=await new Promise(resolve=>requestAnimationFrame(resolve));if(stop)break;if(document.hidden)throw Error('請保持測試頁在前景');const t=performance.now();sim.step();renderer.draw(ctx,count,i,shared);const elapsed=performance.now()-t;if(i>=30){times.push(elapsed);if(previous!==null)intervals.push(stamp-previous);}previous=stamp;$('status').textContent=count+' 隻｜'+(shared?'共享畫格':'逐隻渲染')+'｜'+(i+1)+'/150';}if(times.length){const [avg,p95]=summary(times),[interval]=intervals.length?summary(intervals):[0],stats=renderer.stats();row([count,shared?'共享':'逐隻',avg.toFixed(2),p95.toFixed(2),interval?(1000/interval).toFixed(1):'—',shared?Math.round(100*stats.hits/Math.max(1,stats.hits+stats.misses))+'%':'—']);}}if(stop)break;}$('status').textContent=stop?'已停止':'測試完成';}catch(e){$('status').textContent='測試失敗：'+e.message;}finally{running=false;$('run').disabled=false;$('stop').disabled=true;}};init().catch(e=>$('status').textContent='載入失敗：'+e.message);</script></html>
