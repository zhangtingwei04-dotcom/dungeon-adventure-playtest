<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>燈火｜生物核心效能驗收</title><style>body{background:#142a22;color:#e7dabb;font:16px system-ui;margin:20px}main{max-width:760px;margin:auto}button{padding:12px;background:#304c3b;color:inherit;border:1px solid #b4a77c;border-radius:6px;font:inherit}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:right;padding:8px;border-bottom:1px solid #71806b}td:first-child,th:first-child{text-align:left}p{line-height:1.6}a{color:inherit}</style><main><h2>生物核心效能驗收 V1.0</h2><p>每組模擬 600 幀、固定每幀 16.67ms 遊戲時間。測量感知、刺激、需求、生活行為、決策、狀態及位移；不含像素蒙皮、畫布、碰撞生物彼此或真實戰鬥。數字是此裝置的 CPU 核心執行時間，不代表遊戲 FPS。</p><button id="run">開始四組測試</button><p id="status">尚未測試</p><table><thead><tr><th>生物</th><th>平均 ms/幀</th><th>P95 ms/幀</th><th>更新次數</th></tr></thead><tbody id="out"></tbody></table><p>比較參考：60 FPS 的全遊戲每幀預算約 16.7ms，30 FPS 約 33.3ms。此頁僅測核心，需預留動畫、繪圖與其他系統時間。</p><p><a href="./moss-beast-v3-rig-preview.html?v=41">返回苔棘鬃獸測試平台</a></p></main><script src="./assets/creature_lifestyle_v1.js?v=perf1"></script><script src="./assets/creature_needs_v1.js?v=perf1"></script><script src="./assets/creature_perception_v1.js?v=perf1"></script><script src="./assets/object_stimulus_catalog_v1.js?v=perf1"></script><script src="./assets/creature_stimulus_v1.js?v=perf1"></script><script src="./assets/creature_behavior_v1.js?v=perf1"></script><script src="./assets/creature_world_motion_v1.js?v=perf1"></script><script src="./assets/creature_terrain_v1.js?v=perf1"></script><script src="./assets/creature_environment_sense_v1.js?v=perf1"></script><script src="./assets/creature_status_motion_v1.js?v=perf1"></script><script src="./assets/creature_gait_sync_v1.js?v=perf1"></script><script src="./assets/creature_perf_v1.js?v=1"></script><script>
const run=document.getElementById('run'),out=document.getElementById('out'),status=document.getElementById('status');run.onclick=async()=>{run.disabled=true;out.textContent='';try{for(const count of [1,5,10,20]){status.textContent='測試 '+count+' 隻';const warm=DungeonCreaturePerfV1.create(count);for(let i=0;i<120;i++)warm.step();const sim=DungeonCreaturePerfV1.create(count),times=[];for(let batch=0;batch<30;batch++){await new Promise(resolve=>requestAnimationFrame(resolve));for(let i=0;i<20;i++){const t=performance.now();sim.step();times.push(performance.now()-t);}}const sorted=times.slice().sort((a,b)=>a-b),avg=times.reduce((a,b)=>a+b,0)/times.length;const tr=document.createElement('tr');for(const value of [count,avg.toFixed(3),sorted[Math.ceil(times.length*.95)-1].toFixed(3),sim.result().updates]){const td=document.createElement('td');td.textContent=value;tr.append(td);}out.append(tr);}status.textContent='測試完成';}catch(e){status.textContent='測試失敗：'+e.message;}finally{run.disabled=false;}};</script></html>
