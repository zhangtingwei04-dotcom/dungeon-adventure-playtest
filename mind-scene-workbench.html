<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心象場景結算工作台</title><style>
:root{color-scheme:dark;background:#141b19;color:#eee8d8;font:14px/1.5 system-ui}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:10px 14px}h1,h2{color:#dbbd7c;margin:0 0 6px}h1{font-size:19px}h2{font-size:16px}main{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}section{background:#202b26;border:1px solid #62624b;padding:10px;border-radius:8px;min-width:0}button,select{font:inherit;background:#152019;color:#e8dbb4;border:1px solid #77765c;border-radius:5px;min-height:38px;padding:5px 8px;max-width:100%}small{color:#b9c3b6}p{margin:6px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.tile{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:normal;background:#283d2b;overflow-wrap:anywhere;font-size:12px}.tile.block{background:#3b403c}.tile.selected{outline:2px solid #d9b66a}.tile .unit{color:#f2d594}.gold{color:#dbbd7c}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header><h1>心象場景結算工作台 V1.0</h1><small>獨立規則沙盒｜格點示意，非正式遊戲畫面或存檔</small></header><main><section><h2>林間測試場</h2><p id="energy" class="gold"></p><div class="map" id="map"></div><p id="selected"></p><p id="perception"></p><p id="inventory"></p><p id="observations"></p><small>點選格子作為移動目標；點選右側物件／生物執行互動。每實體每回合一次成功行動。</small></section><section><h2>技能與行動</h2><div class="actions"><select id="skill"><option value="beast">燈獸</option><option value="tool">燈器</option><option value="illusion">幻象</option><option value="puppet">燈偶</option></select><button id="cast">構築</button><button id="advance">下一回合</button><button id="reset">重置</button></div><label>操作實體 <select id="entity"></select></label><p><label>互動目標 <select id="target"><option value="rabbit">月紋兔</option><option value="branch">樹枝</option><option value="mushroom">蘑菇</option><option value="rock">苔石群</option></select></label></p><div class="actions" id="commands"></div><p id="status" role="status"></p><pre id="log"></pre><small>試作行動消耗既有場景分鐘數；手動回合維持心火，兩者尚未接正式世界時計。攻擊、燈域及燈鏈世界效果尚未實作。</small></section></main>
<script src="assets/engine_foundation_v1.js"></script><script src="assets/mind_core_v1.js"></script><script src="assets/mind_growth_v1.js"></script><script src="assets/relic_core_v1.js"></script><script src="assets/lantern_beast_v1.js"></script><script src="assets/mind_form_v1.js"></script><script src="assets/object_investigation_v1.js"></script><script src="assets/scene_action_time_v1.js"></script><script src="assets/mind_scene_v1.js"></script><script>
(()=>{'use strict';const c=window.DungeonMindCoreV1,g=window.DungeonMindGrowthV1,r=window.DungeonRelicCoreV1,f=window.DungeonMindFormV1,w=window.DungeonMindSceneV1,$=id=>document.getElementById(id);if(!w){$('status').textContent='核心載入失敗';return}let profile=c.createProfile({schoolId:'school-4-0',main:'影',phases:['影','續']});for(const q of f.forms.filter(x=>['beast','tool','illusion','puppet'].includes(x.id)))profile=c.createSkill(profile,{id:q.id,name:q.name,materials:[],allocations:q.requires.map(([phase,branch])=>({phase,branch,share:100/q.requires.length}))});let state,chosen='cell-1';const names={move:'移動',sense:'感知',attack:'攻擊（未開放）',useTool:'採集',alterPerception:'干涉感知',commandMove:'指令移動',commandInteract:'指令採集'};const msgs={ALREADY_ACTED:'此實體本回合已行動',INVALID_MOVE:'只能移動至相鄰且可通行格子',OUT_OF_RANGE_OR_TARGET:'目標不存在或距離過遠',NOT_HARVESTABLE:'無可採集資源',NOT_IMPLEMENTED:'此效果尚未實作',ACTION_NOT_AVAILABLE:'此狀態無法行動',ENERGY_OR_OUTPUT:'心火或輸出不足',ALREADY_ACTIVE:'此形態已存在'};
function reset(){state=w.create(f.create(g.create(Object.fromEntries(g.stats.map(k=>[k,11]))),r.create()));chosen='cell-1';$('log').textContent='';render()}
function add(parent,tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el}
function active(){return [...state.forms.effects.map(e=>({id:e.id,formId:e.formId})),...state.forms.life.beasts.filter(b=>b.status==='active').map(b=>({id:b.id,formId:'beast'}))]}
function render(){const all=active(),prior=$('entity').value;const desc=w.describe(state);$('energy').textContent='心火 '+state.forms.life.owner.energy+' / '+state.forms.life.owner.abilities.capacity+'｜回合 '+state.forms.life.turn+'｜場景 '+state.actor.worldMinutes+' 分鐘';$('map').replaceChildren();for(const cell of w.cells){const tile=document.createElement('button');tile.className='tile'+(cell.blocked?' block':'')+(chosen===cell.id?' selected':'');tile.type='button';add(tile,'span','格 '+(Number(cell.id.slice(5))+1)+(cell.blocked?'｜障礙':''));if(cell.id==='cell-0')add(tile,'span','主人');for(const o of desc.filter(o=>o.visible&&o.cell===cell.id))add(tile,'span',o.name);if(state.animal.cell===cell.id)add(tile,'span','月紋兔');for(const e of all.filter(e=>state.positions[e.id]===cell.id))add(tile,'span',f.forms.find(x=>x.id===e.formId).name,'unit');tile.onclick=()=>{chosen=cell.id;render()};$('map').append(tile)}$('selected').textContent='移動目標：格 '+(Number(chosen.slice(5))+1);$('perception').textContent=state.animal.perception?'月紋兔感知：格 '+(Number(state.animal.perception.apparentCell.slice(5))+1)+'（實際仍在格3）':'月紋兔感知：正常';$('inventory').textContent='測試背包：'+(Object.entries(state.actor.inventory).map(([k,v])=>k+' ×'+v).join('、')||'空');$('observations').textContent='觀察紀錄：'+(state.observations.includes('forest4_rabbit')?'月紋兔':'無');$('entity').replaceChildren();for(const e of all){const opt=document.createElement('option');opt.value=e.id;opt.textContent=f.forms.find(x=>x.id===e.formId).name+' '+e.id;$('entity').append(opt)}if(all.some(e=>e.id===prior))$('entity').value=prior;commands()}
function commands(){const id=$('entity').value,e=active().find(x=>x.id===id);$('commands').replaceChildren();if(!e)return;const q=f.forms.find(x=>x.id===e.formId);for(const a of q.actions){const btn=add($('commands'),'button',names[a]||a);btn.disabled=a==='attack';btn.onclick=()=>act(()=>w.action(state,id,a,['move','commandMove'].includes(a)?chosen:$('target').value))}if(e.formId!=='beast'){const btn=add($('commands'),'button','解除');btn.onclick=()=>act(()=>w.release(state,id))}}
function act(fn){try{const x=fn();if(!x.ok){$('status').textContent=msgs[x.reason]||x.reason;return}state=x.state;$('status').textContent=x.event?'行動完成，耗時 '+x.minutes+' 分鐘':'結算完成';$('log').textContent=JSON.stringify(x.event||x.events||{entityId:x.entityId},null,2);render()}catch(e){$('status').textContent=e.message}}
$('entity').onchange=commands;$('cast').onclick=()=>act(()=>w.activate(state,profile,$('skill').value,$('skill').value));$('advance').onclick=()=>act(()=>w.advance(state));$('reset').onclick=()=>{reset();$('status').textContent='已重置'};reset()})();
</script></body></html>
