</style></head><body><main><h1>表情動態 V2.12｜昏迷換眼・暈眩旋轉星星</h1><p>V2.12 預設展示昏迷：原本眼睛不會繪製，直接換成黑線旋轉圈圈眼；任何表情或 HP 都一樣。點「暈眩」可看到頭旁持續繞動的金色 💫 星星。</p><section class="card"><div id="stage" class="stage"><canvas id="avatar" width="64" height="160" aria-label="像素男性角色表情預覽"></canvas></div><div class="face-zoom-panel"><strong>頭頂與臉部特效放大檢查</strong><canvas id="faceCloseup" width="64" height="55" aria-label="放大臉部汗水動態"></canvas><span>V2.12｜昏迷：只有黑線旋轉眼；暈眩：金色 💫 星星繞頭旋轉</span></div><p id="status" aria-live="polite">載入圖層中</p><div class="buttons" id="conditions" aria-label="四種 HP 狀態"></div><p class="meta"><strong>異常狀況特效（可複選）</strong>：只會改變畫面，不會修改 HP 或存檔。</p><div class="buttons" id="abnormalChoices"></div><div class="bar"><button type="button" id="clearAbnormal">清除異常預覽</button></div><p class="meta">其他表情（手動試演）</p><div class="buttons" id="choices"></div><div class="bar"><label><input id="motion" type="checkbox" checked/> 自然眨眼</label><button type="button" id="demo">依序試演四種 HP 狀態</button></div><div class="bar"><label><input id="hair" type="checkbox" checked/> 顯示頭髮</label><label><input id="checker" type="checkbox"/> 透明棋盤格</label><label><input id="dark" type="checkbox"/> 深色背景</label></div><div class="bar"><label for="iris">瞳色</label><select id="iris"><option value="purple">紫色（原始）</option><option value="blue">藍色</option><option value="green">綠色</option><option value="amber">琥珀色</option></select></div><button id="save">分享／儲存目前 64×160 透明 PNG</button><img id="saveimage" class="saveimage" alt="可長按儲存的透明角色圖片"><p class="meta">原始紫眼及中性臉保持不變；關掉頭髮後頭皮、耳朵、五官完整。這裡不修改正式存檔。</p></section></main><script src="./assets/expression_motion.js?v=2.12"></script><script>

tAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWMwDzuAcC0Eu+UQAAAABJRU5ErkJggg=="}}, "labels": {"original": "中性", "smile": "微笑", "happy": "開心", "surprised": "驚訝", "angry": "生氣", "shy": "害羞", "eyesClosed": "閉眼"}};
const state={status:'normal',expressionOverride:null,hair:true,iris:'purple',motionEnabled:true,abnormal:new Set(['unconscious'])};
const motion=window.DungeonExpressionMotion.createActor({id:'player-preview',status:'normal',blink:true});
const conditions={healthy:'健康｜睜眼微笑',normal:'普通｜慢速眨眼',weak:'虛弱｜右額慢速汗',critical:'瀕危｜右額快速汗＋旋轉眼'};
const abnormalLabels=window.DungeonExpressionMotion.abnormalLabels;
let previousFrame='',demoTimers=[];
function stopDemo(){for(const timer of demoTimers)clearTimeout(timer);demoTimers=[];}
const cv=document.getElementById('avatar');const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=false;
const faceCloseup=document.getElementById('faceCloseup');
const faceCtx=faceCloseup.getContext('2d');faceCtx.imageSmoothingEnabled=false;
const imgs={};let count=0;const urls=Object.fromEntries(Object.entries(source.base).map(([k,v])=>['base_'+k,v]));
for(const [pose,parts] of Object.entries(source.expressions)){for(const [k,v] of Object.entries(parts))urls[pose+'_'+k]=v;}
for(const [name,src] of Object.entries(urls)){const im=new Image();imgs[name]=im;im.onload=()=>{count++;render()};im.onerror=()=>{document.getElementById('status').textContent='圖片載入失敗：'+name};im.src=src;}
const colorMap={blue:[85,143,226],green:[78,175,116],amber:[211,150,66]};
function eyeImage(im){if(state.iris==='purple'||!colorMap[state.iris])return im;const c=document.createElement('canvas');c.width=64;c.height=160;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const p=x.getImageData(0,0,64,160),d=p.data;const rgb=colorMap[state.iris];for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(!d[i+3])continue;const violet=b>=r+4&&b>=g+10&&b>=24&&!(r>=205&&g>=180);const magenta=r>=80&&r<=205&&b>=r-20&&b>=g+28&&r>=g+38;if(!violet&&!magenta)continue;const sh=Math.max(.22,Math.min(1.10,(r+g+b)/340));for(let j=0;j<3;j++)d[i+j]=Math.min(255,Math.round(rgb[j]*sh));}x.putImageData(p,0,0);return c;}
function render(){
 motion.setStatus(state.status);motion.setExpressionOverride(state.expressionOverride);motion.setBlink(state.motionEnabled);
 const frame=motion.sample();if(state.abnormal.has('unconscious')){frame.parts.eyes=null;frame.blink=false;}previousFrame=[frame.status,frame.parts.brows,frame.parts.eyes,frame.parts.mouth,frame.effects.sweatPhase,frame.effects.circlePhase,frame.blink,[...state.abnormal].join(','),state.abnormal.size?Math.floor(performance.now()/160):'none'].join('|');
 ctx.clearRect(0,0,64,160);
 const draw=(name,fn)=>{const im=imgs[name];if(im?.complete&&im.naturalWidth===64)ctx.drawImage(fn?fn(im):im,0,0)};
 for(const k of ['body','head','shorts','tank'])draw('base_'+k);
 for(const k of ['brows','eyes','mouth']){
  // Unconsciousness replaces the eye sprite entirely; never paint the
  // normal, recolored, blinking or emotion-specific eye image beneath it.
  if(k==='eyes'&&state.abnormal.has('unconscious'))continue;
  const pose=frame.parts[k],key=pose==='original'?'base_'+k:pose+'_'+k;
  draw(imgs[key]?key:'base_'+k,k==='eyes'?eyeImage:null);
 }
 if(frame.effects.circleEyes&&!state.abnormal.has('unconscious'))for(const x of [25,39])window.DungeonExpressionMotion.drawSpiralEye(ctx,x,36,frame.effects.circlePhase);
 if(state.hair)draw('base_hair');
 // Keep the tiny forehead sweat visible even near the front fringe.
 if(frame.effects.sweat){
  window.DungeonExpressionMotion.drawFaceSweat(ctx,frame.status,frame.effects.sweatPhase);
 }
 if(state.abnormal.size){window.DungeonExpressionMotion.drawAbnormalEffects(ctx,[...state.abnormal],performance.now());}
 // Crop from the SAME fully composited animated figure, not replacement face art.
 faceCtx.clearRect(0,0,64,55);
 faceCtx.drawImage(cv,0,0,64,55,0,0,64,55);
 document.getElementById('status').textContent=count+' / '+Object.keys(imgs).length+' 圖層已載入 · '+conditions[state.status]+(frame.blink?' · 眨眼':'');
 document.querySelectorAll('#conditions button').forEach(x=>x.classList.toggle('on',x.dataset.id===state.status));
 document.querySelectorAll('#choices button').forEach(x=>x.classList.toggle('on',x.dataset.id===state.expressionOverride));
 document.querySelectorAll('#abnormalChoices button').forEach(x=>{x.classList.toggle('on',state.abnormal.has(x.dataset.id));x.setAttribute('aria-pressed',String(state.abnormal.has(x.dataset.id)));});
}
for(const [id,label] of Object.entries(conditions)){
 const btn=document.createElement('button');btn.textContent=label;btn.dataset.id=id;
 btn.onclick=()=>{stopDemo();state.status=id;state.expressionOverride=null;render()};
 document.getElementById('conditions').append(btn);
}
for(const [id,label] of Object.entries(abnormalLabels)){
 const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.dataset.id=id;
 btn.setAttribute('aria-pressed','false');
 btn.onclick=()=>{
  if(state.abnormal.has(id))state.abnormal.delete(id);else state.abnormal.add(id);
  for(const node of document.querySelectorAll('#abnormalChoices button'))node.setAttribute('aria-pressed',String(state.abnormal.has(node.dataset.id)));
  render();
 };
 document.getElementById('abnormalChoices').append(btn);
}
document.getElementById('clearAbnormal').onclick=()=>{
 state.abnormal.clear();
 for(const node of document.querySelectorAll('#abnormalChoices button'))node.setAttribute('aria-pressed','false');
 render();
};
for(const [id,label] of Object.entries(source.labels)){
 const btn=document.createElement('button');btn.textContent=label;btn.dataset.id=id;
 btn.onclick=()=>{stopDemo();state.expressionOverride=id;render()};
 document.getElementById('choices').append(btn);
}
document.getElementById('motion').onchange=e=>{state.motionEnabled=e.target.checked;motion.setBlink(state.motionEnabled);render()};
document.getElementById('demo').onclick=()=>{
 stopDemo();state.expressionOverride=null;
 const sequence=['healthy','normal','weak','critical'];
 for(let i=0;i<sequence.length;i++)demoTimers.push(setTimeout(()=>{state.status=sequence[i];render()},i*3000));
};
/* V2 demo: the four HP loops above remain active. */
setInterval(()=>{
 if(document.hidden)return;
 const frame=motion.sample();
 const key=[frame.status,frame.parts.brows,frame.parts.eyes,frame.parts.mouth,frame.effects.sweatPhase,frame.effects.circlePhase,frame.blink,[...state.abnormal].join(','),state.abnormal.size?Math.floor(performance.now()/160):'none'].join('|');
 if(key!==previousFrame)render();
},75);
document.getElementById('hair').onchange=e=>{state.hair=e.target.checked;render()};document.getElementById('iris').onchange=e=>{state.iris=e.target.value;render()};document.getElementById('checker').onchange=e=>document.getElementById('stage').classList.toggle('checker',e.target.checked);document.getElementById('dark').onchange=e=>document.getElementById('stage').classList.toggle('dark',e.target.checked);
document.getElementById('save').onclick=async()=>{
 render();
 const png=cv.toDataURL('image/png');
 const data=Uint8Array.from(atob(png.split(',')[1]),c=>c.charCodeAt(0));
 const file=new File([data],'hp_face_'+state.status+'_64x160.png',{type:'image/png'});
 const img=document.getElementById('saveimage');img.src=png;img.classList.add('on');
 if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
  try{await navigator.share({files:[file]});return}catch(e){}
 }
 document.getElementById('status').textContent='已產生 PNG：長按下方圖片可儲存';
};
