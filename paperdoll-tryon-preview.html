<h1>紙娃娃白點修正版｜兩張指定原圖</h1><p>使用你最後提供的無上衣與穿背心 JPEG 拆分並修整輪廓白點，非圖片重畫。七張 PNG 同尺寸、同座標。此頁不修改遊戲存檔。</p>
<div class="controls"><button type="button" id="wear" class="active">穿上背心</button><button type="button" id="undress">脫下背心</button><button type="button" id="checker">透明背景檢查</button><button type="button" id="export">匯出目前合成 PNG</button></div>
<div class="panels">
<section class="panel"><h2>無上衣底模</h2><div class="info">六張獨立圖層合成</div><div class="stage"><canvas id="base" width="64" height="160"></canvas></div></section>
<section class="panel"><h2>試穿結果</h2><div class="info" id="wearStatus">背心已穿上</div><div class="stage"><canvas id="result" width="64" height="160"></canvas></div></section>
<section class="panel"><h2>獨立背心</h2><div class="info">只包含透明上衣圖層</div><div class="stage"><canvas id="shirt" width="64" height="160"></canvas></div></section>
</div>
<div class="progress" id="status">正在確認圖片圖層…</div>
<div class="legend"><span class="pill">固定 64 × 160</span><span class="pill">真正 RGBA</span><span class="pill">7 張獨立圖層</span><span class="pill">不改動正式存檔</span></div>
<p class="note"><strong>驗收限制：</strong>無上衣版已移除輪廓白點，故與清理前原圖有少量像素差異；可完整保留拆分圖層；穿衣版仍有兩張 JPEG 的非衣服像素差異，不宣稱與穿衣原圖零差異。衣服與身體輪廓請以畫面確認。</p>

const images={};const order=['body','face','shorts','eyebrows','eyes','hair'];let wearing=true;
const byId=id=>document.getElementById(id);
function paintCanvas(canvas,sequence){let c=canvas.getContext('2d',{willReadFrequently:true});c.imageSmoothingEnabled=false;c.clearRect(0,0,64,160);for(const k of sequence){const image=images[k];if(image&&image.naturalWidth)c.drawImage(image,0,0)}}
function render(){if(Object.keys(images).length!==Object.keys(srcs).length||!Object.values(images).every(x=>x.naturalWidth))return;
 paintCanvas(byId('base'),order);
 paintCanvas(byId('result'),['body','face','shorts',...(wearing?['shirt']:[]),'eyebrows','eyes','hair']);
 paintCanvas(byId('shirt'),['shirt']);
 byId('wear').classList.toggle('active',wearing);byId('undress').classList.toggle('active',!wearing);
 byId('wearStatus').textContent=wearing?'背心已穿上':'背心已脫下';
 byId('status').textContent='七層已載入｜可按「穿上／脫下」測試同一個角色底模';}
for(const [k,src] of Object.entries(srcs)){const image=new Image();images[k]=image;image.onload=render;image.onerror=()=>byId('status').textContent='圖片讀取失敗：'+k;image.src=src}
byId('wear').onclick=()=>{wearing=true;render()};byId('undress').onclick=()=>{wearing=false;render()};
byId('checker').onclick=()=>document.body.classList.toggle('checker');
byId('export').onclick=()=>{let a=document.createElement('a');a.href=byId('result').toDataURL('image/png');a.download=wearing?'new_paperdoll_worn.png':'new_paperdoll_shirtless.png';a.click()};
</script></body></html>
