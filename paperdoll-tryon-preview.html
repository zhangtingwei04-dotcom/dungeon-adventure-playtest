function render(){const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,64,160);for(const key of ['body','face','shorts','brows','eyes','hair']){if(images[key]?.naturalWidth)ctx.drawImage(images[key],0,0,64,160)}}
for(const [key,url] of Object.entries(srcs)){const img=new Image();images[key]=img;img.onload=render;img.onerror=()=>console.warn('圖層載入失敗',key);img.src=url}
document.querySelector('#bg').onchange=e=>document.querySelector('.stage').classList.toggle('checker',e.target.checked);
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='male_shirtless_base_64x160.png';a.href=cv.toDataURL('image/png');a.click()};
