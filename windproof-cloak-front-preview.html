.controls input[type="range"]{accent-color:#d7b981;width:clamp(120px,19vw,200px)}
.controls output{font-weight:750;color:#f2d595}
.stage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.genderHeading{font-weight:750;color:#f1d595;margin:0 0 7px}

<body>
<header><div class="top">
<div><h1>防風披風 V3.1｜正面九部件試穿</h1><p>男女原始 64×160 底模 × 獨立前後披風圖層 · 只做視覺驗收</p></div>
<a class="back" href="./developer-workbench.html?v=cloak-workbench-1">返回開發者工作台</a>
</div></header>
<main>
<div class="panel">
<h2>測試設定</h2>
<p class="note">沿用既有男女底模和頭部；九個部件全部為正面穿戴。後毛領及深色內襯放在底模後方，前毛領中央留空，扣環可單獨調整。僅試穿，不改正式遊戲。</p>
<div class="controls">
<label>顯示角色<select id="gender"><option value="both">男女並排</option><option value="male">只看男性</option><option value="female">只看女性</option></select></label>
<label class="check"><input id="cloakOn" type="checkbox" checked>穿上防風披風 V3</label>
<label class="check"><input id="backOn" type="checkbox" checked>後層</label>
<label class="check"><input id="frontOn" type="checkbox" checked>前層</label>
<label class="check"><input id="hairOn" type="checkbox" checked>顯示頭髮</label>
<label>前毛領 Y：<input id="collarY" type="range" min="-4" max="8" step="1" value="0"></label><label>扣環 Y：<input id="claspY" type="range" min="-4" max="8" step="1" value="0"></label><label class="check"><input id="guides" type="checkbox">肩頸輔助線</label>
<label>X 位移：<output id="xValue">0px</output><input id="cloakX" type="range" min="-8" max="8" step="1" value="0"></label>
<label>Y 位移：<output id="yValue">0px</output><input id="cloakY" type="range" min="-8" max="8" step="1" value="0"></label>
</div>
<div class="actions" style="margin-top:12px">
<button id="reset" type="button">恢復原始位置</button>
<button id="exportComparison" type="button" class="primary">匯出男女對照 PNG</button>
<button id="exportLayers" type="button">匯出九圖層 PNG</button>
</div>
</div>
<div class="stage" id="gallery">
<section class="panel" id="maleSection"><div class="genderHeading">男性｜現有標準底模</div>
<div class="pair"><div class="art"><strong>未穿披風</strong><div class="checker"><canvas id="maleBefore" width="64" height="160"></canvas></div></div>
<div class="art"><strong>披風穿戴測試</strong><div class="checker"><canvas id="maleAfter" width="64" height="160"></canvas></div></div></div></section>
<section class="panel" id="femaleSection"><div class="genderHeading">女性｜新版正式頭部</div>
<div class="pair"><div class="art"><strong>未穿披風</strong><div class="checker"><canvas id="femaleBefore" width="64" height="160"></canvas></div></div>
<div class="art"><strong>披風穿戴測試</strong><div class="checker"><canvas id="femaleAfter" width="64" height="160"></canvas></div></div></div></section>
</div>
<div class="panel"><h2>驗收資訊</h2><div class="note" id="status" role="status">正在載入原始底模與披風圖層…</div>
<p class="small">64×160 原生畫布。以既有工作台底模作初次定位，尚待 iPhone 實際驗收。這個版本使用縮小後的 48 色像素試穿圖集。</p>
</div>
</main>
<script>

 const femaleHair=window.DUNGEON_FEMALE_HAIR_V2;
 const maleHead=window.DungeonMaleV3DomeTrial?.image||male?.head_base;
 let images={},ready=false;
 const settings={gender:'both',cloakOn:true,frontOn:true,backOn:true,hairOn:true,guides:false,x:0,y:0};
 const urls={
   maleBody:source?.male?.body,maleTank:source?.male?.tank,maleShorts:source?.male?.shorts,
   femaleBody:source?.female?.body,femaleTank:source?.female?.tank,femaleShorts:source?.female?.shorts,
   maleHead,maleBrows:male?.eyebrows,maleEyes:male?.eyes,maleMouth:male?.mouth,maleHair:male?.hair_standard,
   femaleHead,femaleHair
 };
 function load(key,url){
  return new Promise((resolve,reject)=>{
   if(typeof url!=='string'||!url.startsWith('data:image/png;base64,'))return reject(Error('缺少素材：'+key));
   const im=new Image();im.onload=()=>{
    if(im.naturalWidth!==64||im.naturalHeight!==160)return reject(Error('尺寸錯誤：'+key));
    images[key]=im;resolve();
   };im.onerror=()=>reject(Error('圖片載入失敗：'+key));im.src=url;
  });
 }
 function context(canvas){const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=false;return ctx;}

  const name=gender==='female'?'female':'male';

  ctx.save();ctx.beginPath();ctx.rect(0,70,24,32);ctx.rect(40,70,24,32);

   const image=images[name+part];

  }
  ctx.restore();

 function makeComposite(gender,withCloak){
