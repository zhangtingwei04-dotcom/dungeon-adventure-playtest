<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心火修煉工作台 V1</title><style>
:root{color-scheme:dark;font:14px/1.5 system-ui;background:#141b19;color:#ede8d9}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:10px 14px}h1,h2{color:#dbbd7c;margin:0 0 8px}h1{font-size:19px}h2{font-size:16px}main{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}section{background:#202b26;border:1px solid #62624b;padding:12px;border-radius:8px;min-width:0}button,select,input{font:inherit;background:#152019;color:#e8dbb4;border:1px solid #77765c;border-radius:5px;min-height:36px;padding:5px 8px}button{cursor:pointer}button:disabled{opacity:.4}small{color:#b9c3b6}p{margin:7px 0}table{width:100%;border-collapse:collapse}td,th{padding:5px 3px;border-bottom:1px solid #455348;text-align:left}td:last-child{text-align:right}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}input[type=number]{width:80px}.gold{color:#dbbd7c}progress{width:100%;height:12px;accent-color:#c5a154}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header><h1>心火修煉工作台 V1.0</h1><small>獨立原型｜重新整理清除資料｜不改正式角色或存檔</small></header><main><section><h2>01 天資擲骰</h2><p>3D6｜最多鎖定三項｜確認後固定</p><table><thead><tr><th>能力</th><th>骰值</th><th>天資</th><th>鎖定</th></tr></thead><tbody id="dice"></tbody></table><div class="actions"><button id="roll">重新擲骰</button><button id="confirm">確認天資</button><button id="reset">重置測試</button></div><small id="lockcount"></small></section><section><h2>02 修煉與回復</h2><p id="realm">尚未確認天資</p><p class="gold" id="energy">—</p><progress id="bar" max="100" value="0"></progress><table><thead><tr><th>能力</th><th>實際值</th><th>上限</th></tr></thead><tbody id="abilities"></tbody></table><p><label>行為 <select id="action"><option value="meditate">冥想</option><option value="breathing">調息</option><option value="fundamentals">基本功</option><option value="burst">爆發訓練</option><option value="observe">觀察</option><option value="practice">技能練習</option><option value="rest">休息回復</option><option value="sleep">睡眠回復</option><option value="daily">日常回復</option></select></label> <label>分鐘 <input type="number" id="minutes" min="1" max="1440" value="60"></label></p><div class="actions"><button id="train" disabled>執行行為</button><button id="spend" disabled>模擬消耗心火</button><button id="break" disabled>模擬突破</button></div><p id="status" role="status"></p><small>所有訓練倍率、起始能力與輸出回復上限皆暫定；突破按鈕僅供測試，不代表正式突破條件。修煉不自動補充心火。</small></section></main><script src="assets/engine_foundation_v1.js"></script><script src="assets/mind_core_v1.js"></script><script src="assets/mind_growth_v1.js"></script><script>
(()=>{'use strict';const g=window.DungeonMindGrowthV1,$=x=>document.getElementById(x);if(!g){$('status').textContent='核心載入失敗';return}let draft=g.roll(),locked=new Set(),state=null;const fmt=n=>Number(n.toFixed(4)).toString(),td=(tr,v)=>{const d=document.createElement('td');d.textContent=v;tr.append(d);return d};
function render(){const host=$('dice');host.replaceChildren();for(const k of g.stats){const tr=document.createElement('tr');td(tr,g.labels[k]);td(tr,draft.values[k]);td(tr,g.rank(draft.values[k]));const cb=document.createElement('input');cb.type='checkbox';cb.checked=locked.has(k);cb.disabled=!!state||(!cb.checked&&locked.size>=3);cb.setAttribute('aria-label','鎖定'+g.labels[k]);cb.onchange=()=>{if(cb.checked)locked.add(k);else locked.delete(k);render()};td(tr,'').append(cb);host.append(tr)}$('lockcount').textContent='已鎖定 '+locked.size+'/3';$('roll').disabled=!!state;$('confirm').disabled=!!state;for(const id of ['train','spend','break'])$(id).disabled=!state;const body=$('abilities');body.replaceChildren();if(!state){$('realm').textContent='尚未確認天資';$('energy').textContent='—';$('bar').value=0;return}const l=g.limits(state.realm);$('realm').textContent=g.realms[state.realm]+'｜修行 '+state.trainingMinutes+' 分鐘';$('energy').textContent='心火 '+fmt(state.energy)+' / '+fmt(state.abilities.capacity);$('bar').max=state.abilities.capacity;$('bar').value=state.energy;for(const k of g.stats){const tr=document.createElement('tr');td(tr,g.labels[k]);td(tr,fmt(state.abilities[k]));td(tr,fmt(l[k]));body.append(tr)}$('break').disabled=state.realm===6}
function act(fn){try{$('status').textContent=fn();render()}catch(e){$('status').textContent=e.message}}
$('roll').onclick=()=>act(()=>{if(state)return '';draft=g.roll(draft.values,[...locked]);return '已重擲未鎖定項目'});$('confirm').onclick=()=>act(()=>{if(!state)state=g.create(draft.values);return '天資已固定'});$('reset').onclick=()=>act(()=>{if(state&&!confirm('重置獨立測試？'))return '未重置';state=null;locked.clear();draft=g.roll();return '已重置'});
$('train').onclick=()=>act(()=>{const a=$('action').value,m=$('minutes').valueAsNumber;if(g.training[a]){const r=g.train(state,a,m);state=r.state;return Object.entries(r.gains).map(([k,v])=>g.labels[k]+' +'+fmt(v)).join('、')}const r=g.recover(state,m,{mode:a});state=r.state;return '回復 '+fmt(r.recovered)+' 心火'});
$('spend').onclick=()=>act(()=>{const n=Math.min(state.energy,state.abilities.output);state={...state,energy:Math.max(0,state.energy-n)};return '模擬消耗 '+fmt(n)});$('break').onclick=()=>act(()=>{const r=g.breakthrough(state,{approved:true});state=r.state;return r.ok?'測試突破成功，容量上限擴大，未直接補滿心火。':'已達最高境界'});render()})();
</script></body></html>
