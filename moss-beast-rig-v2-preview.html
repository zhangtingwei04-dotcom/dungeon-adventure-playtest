<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>苔棘鬃獸｜四足動態骨架試驗</title>
<style>*{box-sizing:border-box}body{margin:0;background:#112820;color:#e6d9b7;font:15px system-ui,sans-serif;padding:12px}main{max-width:850px;margin:auto}h1{font-size:19px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}canvas{width:100%;height:auto;display:block;background:#253c30;border:1px solid #9f8d60;border-radius:8px;image-rendering:pixelated}nav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}button{background:#29483a;border:1px solid #a8915d;color:#f4e7c6;border-radius:5px;padding:9px 12px;font:inherit}button[aria-pressed=true]{background:#d3b879;color:#203126}label{display:inline-flex;align-items:center;gap:6px}small{color:#bcbea9}</style>
<main><h1>苔棘鬃獸 V2｜四足骨架試驗</h1><p>同一張側面母圖；固定腳掌落點，關節帶動身體，非重新生成每一幀。</p><canvas id="scene" width="480" height="220" aria-label="四足動畫預覽"></canvas><nav><button data-mode="original">原圖</button><button data-mode="rest">休息</button><button data-mode="rise">起身</button><button data-mode="walk">原地步態</button><button data-mode="travel">地面行走</button><button data-mode="alert">警戒</button><button data-mode="turn">轉身</button><button data-mode="run">快速奔走</button><label><input id="secondary" type="checkbox" checked>頭部／鬃毛／尾部連動</label><label>速度 <select id="speed"><option value=".5">半速</option><option value="1" selected>正常</option><option value="1.5">快速</option></select></label><button id="pause">暫停</button><label><input id="debug" type="checkbox">顯示骨架與足點</label></nav><p id="status" role="status">讀取 V2 母圖…</p><small>獨立研究頁：尚未接入遊戲。快速奔走為對角小跑試驗；轉身使用既有方向圖，尚非連續骨架旋轉。圖層切割與美術仍待驗收。</small></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d'),img=new Image();
let mode='original',elapsed=0,last=0,paused=false,ready=false,body,parts,bodyPixels,warpCanvas,warpContext,warpPixels;
const turnArts={front:new Image(),quarter:new Image()};
turnArts.front.src='./assets/monsters/moss_beast_v2_front.png';turnArts.quarter.src='./assets/monsters/moss_beast_v2_three_quarter.png';
const ground=136,period=1000,stance=.75,stride=16,travelSpeed=stride/(stance*period);
const gaits={walk:{period,stance,stride,lift:7},run:{period:510,stance:.58,stride:20,lift:11}};
const speedOf=g=>g.stride/(g.stance*g.period);
const limbs=[
 {id:'front',hip:[75,87],knee:[65,112],foot:[42,136],bend:-1,upper:[[59,75],[86,75],[91,94],[78,115],[58,120],[48,109]],lower:[[57,105],[78,111],[64,130],[52,141],[24,141],[23,133],[42,121]],phase:0},
 {id:'rear',hip:[151,93],knee:[147,116],foot:[161,136],bend:1,upper:[[135,77],[164,78],[178,100],[164,122],[140,122],[131,109]],lower:[[138,109],[160,110],[170,123],[178,138],[144,142],[139,132],[145,124]],phase:.25}
];
const clamp=(n,l,h)=>Math.max(l,Math.min(h,n)),len=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]),angle=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]),ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function path(g,poly){g.beginPath();poly.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();}
function layer(poly){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const g=c.getContext('2d');g.imageSmoothingEnabled=false;path(g,poly);g.clip();g.drawImage(img,0,0);return c;}
function prepare(){
 body=document.createElement('canvas');body.width=img.naturalWidth;body.height=img.naturalHeight;const g=body.getContext('2d');g.drawImage(img,0,0);
 // Preserve the shoulders/hips for overlap while removing the moving leg silhouettes.
 g.globalCompositeOperation='destination-out';for(const l of limbs){path(g,l.lower);g.fill();path(g,l.upper.map(([x,y])=>[x,Math.max(y,l.hip[1]+8)]));g.fill();}
 g.fillRect(0,140,body.width,body.height-140);
 parts=limbs.map(l=>({...l,a:len(l.hip,l.knee),b:len(l.knee,l.foot),u:layer(l.upper),v:layer(l.lower)}));
 bodyPixels=g.getImageData(0,0,body.width,body.height);warpCanvas=document.createElement('canvas');warpCanvas.width=body.width;warpCanvas.height=body.height;warpContext=warpCanvas.getContext('2d');warpPixels=warpContext.createImageData(body.width,body.height);
}
// Soft, bounded secondary motion in mother-image coordinates. No new silhouettes.
// The hip/shoulder attachment bands remain fixed so the leg rig is unaffected.
function secondaryMotion(mode,elapsed,phase){
 const cycle=phase*2*Math.PI,breath=Math.sin(elapsed/1000*2*Math.PI/3.4);
 if(mode==='run')return {head:1.3*Math.sin(2*cycle-.4),mane:1.1*Math.sin(2*cycle-1.1),tail:2.2*Math.sin(cycle-1),alert:0};
 if(mode==='walk'||mode==='travel')return {head:.85*Math.sin(2*cycle-.4),mane:.65*Math.sin(2*cycle-1.1),tail:1.7*Math.sin(cycle-1.0),alert:0};
 if(mode==='rise'){const p=ease(elapsed/850);return {head:-1.5*p*(1-p)*4,mane:.45*Math.sin(Math.PI*p),tail:.8*Math.sin(Math.PI*p),alert:0};}
 if(mode==='alert'){const p=ease(elapsed/500);return {head:-1.8*p,mane:.6*p+.15*breath,tail:-1.3*p+.3*breath,alert:p};}
 return {head:.28*breath,mane:.22*breath,tail:.45*Math.sin(elapsed/1000*2*Math.PI/3.4-.8),alert:0};
}
function displacement(x,y,m){
 const head=(1-ease((x-26)/48))*ease((y-22)/34)*(1-ease((y-92)/17));
 const mane=ease((x-45)/25)*(1-ease((x-145)/25))*(1-ease((y-30)/44));
 const tail=ease((x-164)/35)*ease((y-45)/27);
 // Attenuate displacement near the two fixed leg attachment points.
 const anchor=(cx,cy)=>ease(Math.hypot(x-cx,y-cy)/22);
 const fixed=anchor(75,87)*anchor(151,93);
 return [fixed*(m.head*.18*head+m.mane*.5*mane-m.tail*.27*tail),fixed*(m.head*head+m.mane*mane+m.tail*tail)];
}
function warpedBody(m){
 if(!bodyPixels||!$('secondary').checked)return body;
 const w=body.width,h=body.height,src=bodyPixels.data,dst=warpPixels.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const [dx,dy]=displacement(x,y,m),sx=Math.round(x-dx),sy=Math.round(y-dy),out=4*(y*w+x);
  if(sx<0||sx>=w||sy<0||sy>=h){dst[out]=dst[out+1]=dst[out+2]=dst[out+3]=0;continue;}
  const i=4*(sy*w+sx);dst[out]=src[i];dst[out+1]=src[i+1];dst[out+2]=src[i+2];dst[out+3]=src[i+3];
 }
 warpContext.putImageData(warpPixels,0,0);return warpCanvas;
}
function solve(hip,foot,a,b,bend){
 const dx=foot[0]-hip[0],dy=foot[1]-hip[1],raw=Math.hypot(dx,dy),d=clamp(raw,Math.abs(a-b)+.01,a+b-.01);
 const base=Math.atan2(dy,dx),off=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1));
 const theta=base+bend*off;return [hip[0]+Math.cos(theta)*a,hip[1]+Math.sin(theta)*a];
}
function limbPhase(l,phase,far,g){return (phase+(g===gaits.run?(l.id==='rear'?.5:0):l.phase)+(far?.5:0))%1;}
function footAt(l,phase,walk,far,g=gaits.walk){
 const p=limbPhase(l,phase,far,g);let x=l.foot[0]+(l.id==='front'?5:0),y=ground;
 // Four-beat crawl: only one limb swings at a time. During support,
 // local foot motion cancels the body's forward world translation.
 if(walk){if(p<g.stance)x+=-g.stride/2+g.stride*(p/g.stance);else{const t=(p-g.stance)/(1-g.stance);x+=g.stride/2-g.stride*ease(t);y-=g.lift*Math.sin(Math.PI*t)**2;}}
 if(far){x+=5;y-=3;}return [x,y];
}
function support(l,phase,far,g=gaits.walk){return limbPhase(l,phase,far,g)<g.stance;}
function segment(bitmap,fromA,fromB,toA,toB){ctx.save();ctx.translate(...toA);ctx.rotate(angle(toA,toB)-angle(fromA,fromB));ctx.translate(-fromA[0],-fromA[1]);ctx.drawImage(bitmap,0,0);ctx.restore();}
function drawLeg(l,phase,dy,walk,far,debug,overlays,gait){
 const hip=[l.hip[0]+(far?5:0),l.hip[1]+dy-(far?3:0)],foot=footAt(l,phase,walk,far,gait),knee=solve(hip,foot,l.a,l.b,l.bend);
 ctx.save();if(far)ctx.filter='brightness(.65)';segment(l.u,l.hip,l.knee,hip,knee);segment(l.v,l.knee,l.foot,knee,foot);ctx.restore();
 if(debug)overlays.push({hip,knee,foot,far,planted:!walk||support(l,phase,far,gait)});
}
// Directional turn study: approved side, quarter and front drawings are
// grounded by their lower edge. This is a staged sprite turn, not 3D rotation.
function turnPose(ms){
 const p=clamp(ms/1250,0,1);
 if(p<.2)return {view:'side',mirror:false};
 if(p<.4)return {view:'quarter',mirror:false};
 if(p<.6)return {view:'front',mirror:false};
 if(p<.8)return {view:'quarter',mirror:true};
 return {view:'side',mirror:true};
}
function drawTurn(){
 const p=turnPose(elapsed),art=p.view==='side'?img:turnArts[p.view];
 if(!art.complete||!art.naturalWidth){ctx.drawImage(img,0,0);return;}
 // Normalize height by view, rather than shrinking width through zero.
 const h=p.view==='front'?132:p.view==='quarter'?133:img.naturalHeight;
 const w=art.naturalWidth*h/art.naturalHeight;
 ctx.save();ctx.translate(105,ground+5);if(p.mirror)ctx.scale(-1,1);
 ctx.drawImage(art,-w/2,-h,w,h);ctx.restore();
}
function render(){
 ctx.clearRect(0,0,480,220);const bg=ctx.createLinearGradient(0,0,0,220);bg.addColorStop(0,'#203a31');bg.addColorStop(1,'#43513b');ctx.fillStyle=bg;ctx.fillRect(0,0,480,220);
 const running=mode==='run',walk=mode==='walk'||mode==='travel'||running,gait=running?gaits.run:gaits.walk,phase=(elapsed/gait.period)%1,dy=mode==='rest'?17:mode==='rise'?5+12*(1-ease(elapsed/850)):running?7+1.1*Math.cos(phase*4*Math.PI):walk?5+.9*Math.cos(phase*8*Math.PI):5;
 const debug=$('debug').checked,overlays=[];const baseX=mode==='travel'||running?490-(elapsed*speedOf(gait))%710:130;
 ctx.strokeStyle='#89906b66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,190);ctx.lineTo(480,190);ctx.stroke();for(let x=0;x<480;x+=24){ctx.fillStyle='#9ca07866';ctx.fillRect(x,190,2,3);}
 ctx.save();ctx.translate(baseX,48);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#19291e99';ctx.beginPath();ctx.ellipse(105,ground+4,83,7,0,0,Math.PI*2);ctx.fill();
 if(debug){ctx.strokeStyle='#baae76';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(-110,ground);ctx.lineTo(330,ground);ctx.stroke();ctx.setLineDash([]);}
 if(ready){if(mode==='original')ctx.drawImage(img,0,0);else if(mode==='turn')drawTurn();else{for(const l of parts)drawLeg(l,phase,dy,walk,true,debug,overlays,gait);ctx.drawImage(warpedBody(secondaryMotion(mode,elapsed,phase)),0,dy);for(const l of parts)drawLeg(l,phase,dy,walk,false,debug,overlays,gait);}}
 if(debug){for(const {hip,knee,foot,far,planted} of overlays){ctx.strokeStyle=far?'#7898a1':'#e2c475';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(...hip);ctx.lineTo(...knee);ctx.lineTo(...foot);ctx.stroke();for(const p of [hip,knee]){ctx.fillStyle='#f4db91';ctx.fillRect(p[0]-1.5,p[1]-1.5,3,3);}ctx.fillStyle=planted?'#a8e5a2':'#e7b880';ctx.fillRect(foot[0]-2,foot[1]-2,4,4);}}
 ctx.restore();ctx.fillStyle='#ddd1ae';ctx.font='12px system-ui';ctx.fillText(walk?'步態相位 '+Math.round(phase*100)+'%':mode==='rise'?'起身 '+Math.round(clamp(elapsed/850,0,1)*100)+'%':mode==='rest'?'低伏':mode==='alert'?'警戒':mode==='turn'?'轉身 '+Math.round(clamp(elapsed/1250,0,1)*100)+'%':'母圖',12,18);
}
function tick(now){if(!paused)elapsed+=Math.min(60,last?now-last:0)*Number($('speed').value);last=now;render();requestAnimationFrame(tick);}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;elapsed=0;paused=false;$('pause').textContent='暫停';for(const n of document.querySelectorAll('[data-mode]'))n.setAttribute('aria-pressed',String(n===b));};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停';};
img.onload=()=>{prepare();ready=true;$('status').textContent='母圖 '+img.naturalWidth+' × '+img.naturalHeight+'；四拍步態、三足支撐；頭部、棘鬃與尾部使用同一母圖的小幅形變。';document.querySelector('[data-mode="original"]').click();requestAnimationFrame(tick);};
img.onerror=()=>$('status').textContent='母圖載入失敗，未使用替代舊圖。';
img.src='./assets/monsters/moss_beast_v2_side.png';
</script></html>
