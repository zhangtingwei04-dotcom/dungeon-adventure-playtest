<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142e29">
<title>男性頭部 V8g｜下巴上收與髮型位置檢查</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#122d28;color:#efe4ce;font-family:system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto}h1{font-size:19px;margin:0 0 8px}p{font-size:12px;line-height:1.6;color:#c6d0c8}
.check{border:1px solid #719385;border-radius:8px;padding:9px 11px;margin:12px 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#24463d;border:1px solid #527c6c;border-radius:9px;padding:10px;text-align:center;min-width:0}
.stage{position:relative;width:100%;aspect-ratio:64/88;overflow:hidden;margin:4px auto 10px;image-rendering:pixelated}
.stage img{position:absolute;width:100%;height:auto;top:0;left:0;image-rendering:pixelated;pointer-events:none}
/* Male hair stays at native 64x160 position without any Y offset. */
#hair{transform:none}
.card strong{font-size:13px}.mono{font-variant-numeric:tabular-nums}
a{color:#f3dba9}button{border:1px solid #ae9566;border-radius:5px;background:#31564b;color:#fff1d3;padding:9px 12px;min-height:38px}
.small{font-size:12px;color:#aebbb0}
</style>
</head>
<body>
<main>
<h1>男性頭部 V8g｜下巴上收 1px</h1>
<p>此頁直接載入正式遊戲的 64×160 最新男性 V8g 頭部。頭部整體座標不動，雙眼與嘴巴維持先前各上移 1 個原生像素；只有下巴底部上收 1 個原生像素。銀白色頭髮保留原圖與原生位置，已撤銷先前向上 2px 的位移。左側是最新光頭，右側是同一顆頭疊加原位透明髮。</p>
<div id="check" class="check" role="status">正在確認素材…</div>
<div class="grid">
 <div class="card"><div class="stage"><img class="head" alt="同一顆男性新頭"></div><strong>V8g｜光頭</strong></div>
 <div class="card"><div class="stage"><img class="head" alt="搭配 V8b 頭髮的新男性頭"><img id="hair" alt="銀白透明新頭髮"></div><strong>V8g＋原位髮型</strong></div>
</div>
<p class="small">正常遊戲的頭部和髮型也都沿用同一張 64×160 像素座標。若看起來沒有變化，請留意最下方下巴只上收 1 個像素，眼嘴與頭頂均沒有再次移動。頁面若顯示載入失敗，請重新開啟。</p>
<p><button id="reload" type="button">重新核對素材</button> <a href="./?hair-art=v8b-20261122">回到正式遊戲（重新要求新版頁面）</a></p>
</main>
<script src="./assets/male_new_head_v8.js?v=8"></script>
<script src="./assets/male_hair_v8.js?v=5"></script>
<script>
(()=>{
 'use strict';
 const check=document.getElementById('check');
 const head=window.DUNGEON_MALE_SHARED_FACE_V5,hair=window.DUNGEON_MALE_HAIR_V8;
 if(!(typeof head==='string'&&head.startsWith('data:image/png;base64,'))||
    !(typeof hair==='string'&&hair.startsWith('data:image/png;base64,'))){
  check.textContent='缺少男性 V8g 頭部或原位髮型素材，請回報此訊息。';
  return;
 }
 let ready=0;let failed=false;
 function done(){if(++ready===3&&!failed)check.textContent='載入成功：男性 V8g 頭（下巴上收 1px）＋原位透明髮型';}
 for(const img of document.querySelectorAll('img.head')){
  img.onload=()=>img.naturalWidth===64&&img.naturalHeight===160?done():check.textContent='頭部尺寸錯誤';
  img.onerror=()=>{failed=true;check.textContent='男性頭部 PNG 載入失敗'};
  img.src=head;
 }
 const im=document.getElementById('hair');
 im.onload=()=>im.naturalWidth===64&&im.naturalHeight===160?done():check.textContent='髮型尺寸錯誤';
 im.onerror=()=>{failed=true;check.textContent='新版透明頭髮 PNG 載入失敗'};
 im.src=hair;
 document.getElementById('reload').onclick=()=>location.reload();
})();
</script>
</body>
</html>
