ent 75%,#cedbd2 75%),linear-gradient(-45deg,transparent 75%,#cedbd2 75%);background-color:#f3f8f3;background-size:24px 24px;margin:9px auto;display:block}.save a{color:#ffdc9b;display:block;margin:10px 0;text-align:center}details{border-top:1px solid #507466;padding:8px 0}summary{font-size:13px;cursor:pointer;color:#ffe7b5}.tiny{font-size:11px} .full{width:100%;margin-top:6px}@media(max-width:650px){.layout{grid-template-columns:1fr}#stage{height:50vh;min-height:260px}.row select{width:58%}}</style></head><body><main><h1>紙娃娃角色自訂｜男性／女性標準型</h1><p>使用正式男性七層與女性馬甲線設計七層。可在這裡切換性別、髮色、膚色、瞳色、背心與短褲；外觀選擇和正式遊戲存檔互相獨立，這裡用於驗收。</p><div class="layout"><section><div id="stage" class="checker"><canvas id="avatar" width="64" height="160"></canvas></div><div id="status">載入角色圖層中…</div><label><input type="checkbox" id="bg" checked> 顯示透明背景棋盤</label><button class="full" id="download">分享／匯出目前透明角色 PNG</button><div id="savebox" class="save"><p>若系統分享無法使用，可以長按圖片儲存。檔案真正透明，沒有棋盤格。</p><img id="saveimage" alt="長按儲存角色"><a id="saveto" download="paperdoll_avatar.png">下載 PNG 到檔案</a></div></section><section><b>性別（兩者皆為標準體型）</b><div id="genders" class="buttons" style="margin:9px 0"><button data-gender="male">男性</button><button data-gender="female">女性</button></div><b>衣服（兩張獨立圖層）</b><div class="buttons" style="margin:9px 0"><button data-clothes="base">無衣</button><button data-clothes="shorts">穿短褲</button><button data-clothes="dressed">背心＋短褲</button></div><div class="row"><label for="skin">膚色</label><select id="skin"><option value="original">原始膚色</option><option value="fair">淺膚</option><option value="warm">暖膚</option><option value="tan">小麥</option><option value="deep">深膚</option></select></div><div class="row"><label for="eyes">瞳色</label><select id="eyes"><option value="purple">紫色</option><option value="blue">藍色</option><option value="green">綠色</option><option value="amber">琥珀色</option></select></div><div class="row"><label for="hair">髮色</label><input id="hair" type="color" value="#c8cbd0"></div><div class="tags" id="toggle"></div><details><summary>未來可匯入的擴充素材（15 個插槽）</summary><p class="muted">髮型、臉型、眼型、眉型、嘴型、表情、耳型、體毛、疤痕、紋身、耳飾、頸飾、尾巴、翅膀、角；未有實際 PNG 時不會偽裝成已開放。</p></details><p class="tiny">素材統一 64×160 RGBA、同座標；切換男／女不會變更其他遊戲裝備資料。</p></section></div></main><script>

const LABEL={body:'身體',face:'臉',brows:'眉毛',eyes:'眼睛',hair:'頭髮',tank:'背心',shorts:'短褲'};

const SKIN={fair:[252,218,187],warm:[242,188,145],tan:[207,144,102],deep:[156,99,72]};

const KEY='paperdoll_editor_preview_v1';

function tint(src,key){if(key==='eyes'&&state.eyes==='purple'||(key==='body'||key==='face')&&state.skin==='original'||key==='hair'&&state.hair==='#c8cbd0')return src;
 const c=document.createElement('canvas');c.width=64;c.height=160;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=false;x.drawImage(src,0,0);

 let hairRgb=[0,0,0];if(key==='hair'){hairRgb=[1,3,5].map(i=>parseInt(state.hair.slice(i,i+2),16))}
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(!d[i+3])continue;
