<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心象形態工作台 V1.0</title><style>
:root{color-scheme:dark;background:#141b19;color:#ede8d9;font:14px/1.5 system-ui}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:10px 14px}h1,h2{color:#dbbd7c;margin:0 0 8px}h1{font-size:19px}h2{font-size:16px}main{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}section{background:#202b26;border:1px solid #62624b;padding:12px;border-radius:8px;min-width:0}button,select,input{font:inherit;background:#152019;color:#e8dbb4;border:1px solid #77765c;border-radius:5px;min-height:36px;padding:5px 8px;max-width:100%}button:disabled{opacity:.4}small{color:#b9c3b6}p{margin:7px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#141b19;padding:8px;border-radius:6px;font-size:12px}article{border-top:1px solid #566259;padding:7px 0}.gold{color:#dbbd7c}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header><h1>心象形態工作台 V1.0</h1><small>獨立規則測試｜非正式戰鬥或場景｜重整清除</small></header><main><section><h2>01 發動與維持</h2><p id="energy" class="gold"></p><label>形態 <select id="form"></select></label><p id="rule"></p><label>目標 <input id="target" value="測試目標" maxlength="100"></label><div class="actions"><button id="cast">發動</button><button id="advance">下一回合</button><button id="reset">重置</button></div><div id="active"></div><small>原型角色具有6點輸出，維持中的形態共用每回合輸出預算。選擇光相燈域或影續形態時會重置測試角色；不代表正式相性可以任意切換。</small></section><section><h2>02 行為契約</h2><label>形態實體 <select id="entity"></select></label><div class="actions" id="commands"></div><p id="status" role="status"></p><pre id="result"></pre><small>行為只提出請求，不執行實際移動、傷害或世界變化。正式場景須另驗證目標、距離、成本與效果。</small></section></main><script src="assets/engine_foundation_v1.js"></script><script src="assets/mind_core_v1.js"></script><script src="assets/mind_growth_v1.js"></script><script src="assets/relic_core_v1.js"></script><script src="assets/lantern_beast_v1.js"></script><script src="assets/mind_form_v1.js"></script><script>
(()=>{'use strict';const c=window.DungeonMindCoreV1,g=window.DungeonMindGrowthV1,r=window.DungeonRelicCoreV1,f=window.DungeonMindFormV1,$=id=>document.getElementById(id);if(!f){$('status').textContent='核心載入失敗';return}const actions={move:'移動',sense:'感知',attack:'攻擊',useTool:'使用工具',markArea:'標記區域',alterPerception:'干涉感知',maintainLink:'維持連結',commandMove:'指令移動',commandInteract:'指令互動'},statuses={active:'活動',dormant:'休眠',collapsed:'形體崩潰',dispersed:'消散',destroyed:'毀滅'};let state,profile,group;
function reset(nextGroup){group=nextGroup;profile=group==='light'?c.createProfile({schoolId:'school-1-2',main:'光',phases:['光']}):c.createProfile({schoolId:'school-4-0',main:'影',phases:['影','續']});for(const q of f.forms.filter(x=>(x.id==='zone')===(group==='light'))){profile=c.createSkill(profile,{id:q.id,name:q.name,materials:[],allocations:q.requires.map(([phase,branch])=>({phase,branch,share:100/q.requires.length}))})}state=f.create(g.create(Object.fromEntries(g.stats.map(k=>[k,11]))),r.create());render()}
function option(value,text){const x=document.createElement('option');x.value=value;x.textContent=text;return x}
for(const q of f.forms)$('form').append(option(q.id,q.name));
function render(){const q=f.forms.find(x=>x.id===$('form').value);$('rule').textContent=q.requires.map(x=>x.join('・')).join(' ＋ ')+'｜發動 '+q.cost+'｜'+(q.upkeep?'維持 '+q.upkeep:'持續 '+q.duration+' 回合');$('energy').textContent='主人心火 '+state.life.owner.energy+' / '+state.life.owner.abilities.capacity+'｜輸出 '+state.life.owner.abilities.output+'｜回合 '+state.life.turn;const entries=[...state.effects.map(e=>({id:e.id,formId:e.formId,label:f.forms.find(x=>x.id===e.formId).name+'｜'+(e.remaining===null?'持續供能':'剩餘 '+e.remaining+' 回合')})),...state.life.beasts.map(b=>({id:b.id,formId:'beast',label:b.name+'｜'+statuses[b.status]}))];const old=$('entity').value;$('active').replaceChildren(...entries.map(e=>{const a=document.createElement('article');a.textContent=e.id+' '+e.label;return a}));$('entity').replaceChildren(...entries.map(e=>option(e.id,e.label)));if(entries.some(e=>e.id===old))$('entity').value=old;renderCommands()}
function renderCommands(){const id=$('entity').value,e=state.effects.find(x=>x.id===id),b=state.life.beasts.find(x=>x.id===id),q=f.forms.find(x=>x.id===(e?.formId||(b?'beast':'')));$('commands').replaceChildren();if(!q)return;for(const a of q.actions){const btn=document.createElement('button');btn.textContent=actions[a];btn.onclick=()=>act(()=>f.requestAction(state,id,a,$('target').value));$('commands').append(btn)}if(e){const btn=document.createElement('button');btn.textContent='解除形態';btn.onclick=()=>act(()=>f.release(state,id));$('commands').append(btn)}}
const msgs={ENERGY_OR_OUTPUT:'心火或輸出不足',ACTION_NOT_AVAILABLE:'當前形態或狀態無法執行',WRONG_BRANCH:'衍象不符',ALREADY_ACTIVE:'同技能與目標已存在',INVALID_TARGET:'請填入目標'};
function act(fn){try{const x=fn();if(x.ok===false){$('status').textContent=msgs[x.reason]||x.reason;return}state=x.state;$('status').textContent=x.intent?'已提出行為請求（尚未執行）':'規則結算完成';$('result').textContent=JSON.stringify(x.intent||x.events||{entityId:x.entityId,power:x.power},null,2);render()}catch(e){$('status').textContent=e.message}}
$('form').onchange=()=>{const next=$('form').value==='zone'?'light':'shadow';if(next!==group){reset(next);$('status').textContent='已切換測試角色並重置'}else render()};$('entity').onchange=renderCommands;$('cast').onclick=()=>act(()=>f.activate(state,profile,$('form').value,$('form').value,{target:$('target').value}));$('advance').onclick=()=>act(()=>f.advance(state));$('reset').onclick=()=>{reset(group);$('result').textContent='';$('status').textContent='已重置'};reset('shadow')})();
</script></body></html>
