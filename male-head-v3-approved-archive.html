const order=['head_base','eyebrows','eyes','mouth','hair_standard'];
const labels={head_base:'頭部底圖',eyebrows:'眉毛',eyes:'眼睛',mouth:'嘴巴',hair_standard:'頭髮'};
const imgs={};const bodyImgs={};const active=Object.fromEntries(order.map(x=>[x,true]));
function load(src,cb){const im=new Image();im.onload=cb;im.src=src;return im}
function draw(){const h=document.getElementById('head').getContext('2d');h.imageSmoothingEnabled=false;h.clearRect(0,0,64,64);
const f=document.getElementById('full').getContext('2d');f.imageSmoothingEnabled=false;f.clearRect(0,0,64,160);
for(const k of ['body','shorts','tank']){const im=bodyImgs[k];if(im?.complete&&im.naturalWidth)f.drawImage(im,0,0)}
for(const k of order){const im=imgs[k];if(active[k]&&im?.complete&&im.naturalWidth){h.drawImage(im,0,0,64,64,0,0,64,64);f.drawImage(im,0,0)}}}
for(const k of order){const el=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=()=>{active[k]=c.checked;draw()};el.append(c,labels[k]);document.querySelector('#toggles').appendChild(el)}
for(const k of order)imgs[k]=load(assets[k],draw);
for(const k of ['body','shorts','tank'])bodyImgs[k]=load(bodies[k],draw);
function preset(names){document.querySelectorAll('#toggles input').forEach((el,i)=>{el.checked=names.includes(order[i]);active[order[i]]=el.checked});draw()}
document.querySelector('#all').onclick=()=>preset(order);
document.querySelector('#bald').onclick=()=>preset(order.filter(x=>x!=='hair_standard'));
document.querySelector('#base').onclick=()=>preset(['head_base']);
document.querySelector('#export').onclick=async()=>{draw();const canvas=document.querySelector('#head');const uri=canvas.toDataURL('image/png');document.querySelector('#saveimg').src=uri;document.querySelector('#savea').href=uri;document.querySelector('#save').classList.add('show');};
</script></body></html>
