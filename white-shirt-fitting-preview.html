let gender='male',ready={};
function pixelPoly(ctx,color,points){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(const point of points.slice(1))ctx.lineTo(...point);ctx.closePath();ctx.fill();}
function rect(ctx,color,x,y,w,h){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function drawShirt(ctx,gender){
  const ink='#3b2924',edge='#776154',shad='#c9b9ac',cloth='#f5eee6',highlight='#fffaf3',seam='#aa9487',tie='#68452b';
  // Separate collarless base garment + symmetrical short sleeves, fitted to the native 64x160 body grid.
  pixelPoly(ctx,ink,[[21,58],[27,59],[37,59],[43,58],[45,64],[45,73],[44,80],[44,91],[42,95],[22,95],[20,91],[20,80],[19,73],[19,64]]);
  pixelPoly(ctx,ink,[[19,60],[16,61],[12,68],[12,72],[18,76],[22,73],[24,65]]);
  pixelPoly(ctx,ink,[[45,60],[48,61],[52,68],[52,72],[46,76],[42,73],[40,65]]);
  pixelPoly(ctx,cloth,[[19,62],[17,63],[14,69],[14,71],[18,73],[22,69],[23,64]]);
  pixelPoly(ctx,cloth,[[45,62],[47,63],[50,69],[50,71],[46,73],[42,69],[41,64]]);
  rect(ctx,shad,14,70,5,2);rect(ctx,shad,45,70,5,2);rect(ctx,edge,13,71,5,1);rect(ctx,edge,46,71,5,1);
  const waistL=gender==='female'?23:22,waistR=gender==='female'?41:42;
  pixelPoly(ctx,cloth,[[23,61],[28,60],[36,60],[41,61],[43,67],[43,80],[waistR,91],[waistR,93],[waistL,93],[waistL,91],[21,80],[21,67]]);
  // Light from top left, side folds, shortened front hem so the original shorts stay visible.
  pixelPoly(ctx,shad,[[39,64],[42,66],[42,82],[waistR,92],[39,92],[40,81]]);
  pixelPoly(ctx,highlight,[[23,65],[27,62],[30,63],[28,80],[25,89],[23,88]]);
  rect(ctx,seam,22,89,1,4);rect(ctx,shad,waistL,92,waistR-waistL+1,1);
  rect(ctx,edge,waistL,94,waistR-waistL+1,1);
  // Defined V collar with a small glimpse of original inner garment.
  pixelPoly(ctx,edge,[[26,60],[29,61],[32,66],[35,61],[38,60],[38,63],[34,68],[32,70],[30,68],[26,63]]);
  pixelPoly(ctx,ink,[[28,61],[32,66],[36,61],[36,63],[32,69],[28,63]]);
  pixelPoly(ctx,'#eee3d6',[[29,61],[32,65],[35,61],[35,63],[32,67],[29,63]]);
  // Narrow dark cord lacing; all marks remain pixel-grid aligned.
  rect(ctx,tie,31,69,2,11);
  for(const y of [70,75,80]){rect(ctx,tie,27,y,5,1);rect(ctx,tie,32,y,5,1);rect(ctx,tie,28,y+1,2,1);rect(ctx,tie,34,y+1,2,1);}
  rect(ctx,shad,26,87,4,1);rect(ctx,shad,35,88,5,1);
}
function drawImg(ctx,img){ctx.drawImage(img,0,0,64,160)}
function load(src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function render(){
  const s=SOURCES[gender];if(!ready[gender])ready[gender]=await Promise.all([load(s.body),load(s.shorts),load(s.tank)]);
  const a=document.getElementById('before'),b=document.getElementById('after'),ca=a.getContext('2d'),cb=b.getContext('2d');
  ca.clearRect(0,0,64,160);cb.clearRect(0,0,64,160);
  for(const i of ready[gender]){drawImg(ca,i);drawImg(cb,i)}
  drawShirt(cb,gender); 
}
for(const g of ['male','female'])document.getElementById(g).onclick=()=>{gender=g;for(const id of ['male','female'])document.getElementById(id).setAttribute('aria-pressed',String(g===id));render()};
document.getElementById('export').onclick=()=>{const c=document.createElement('canvas');c.width=64;c.height=160;drawShirt(c.getContext('2d'),gender);const a=document.createElement('a');a.download='starter_white_shirt_'+gender+'_64x160_v1.png';a.href=c.toDataURL('image/png');a.click()};
render();
</script></body></html>
