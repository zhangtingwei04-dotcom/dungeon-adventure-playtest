<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>燈火｜單隻戰鬥驗收 V1.0</title><style>body{background:#142a22;color:#e7dabb;font:14px system-ui;margin:8px}main{max-width:850px;margin:auto}h2{font-size:18px;margin:6px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid #8e805d;box-sizing:border-box}button{font:inherit;color:inherit;background:#2d4937;border:1px solid #9b895b;border-radius:5px;padding:8px 12px}button:disabled{opacity:.4}nav{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.stats{display:flex;gap:16px;flex-wrap:wrap}.stats div{flex:1;min-width:120px}meter{width:100%}p{margin:6px 0;line-height:1.4}a{color:inherit}</style><main><h2>破損馬車｜單隻戰鬥驗收 V1.0</h2><canvas id="c" width="480" height="270"></canvas><div class="stats"><div>主角 HP <span id="hero"></span><meter id="heroBar" min="0" max="16"></meter></div><div>苔棘鬃獸 HP <span id="enemy"></span><meter id="enemyBar" min="0" max="8"></meter></div></div><p id="range"></p><p id="intent"></p><p id="feedback" aria-live="polite"></p><nav id="actions"></nav><nav><label><input type="checkbox" id="slippery">濕滑地面判定</label><button id="reset">重新測試</button></nav><p>獨立第一人稱戰鬥候選，正式開局規則快照（8 HP、五回合脫離規則）。傷害由回合判定，不由畫面碰撞決定。怪物移動使用固定候選站位，背景物件靜態；尚無探索狀態接續、地形 IK 或多人戰鬥。正式遊戲與存檔不變。</p><p><a href="./wreck-scene-integration-preview.html">返回場景驗收</a></p></main><script src="./assets/forest_v5_neutral_background.js?v=1"></script><script src="./assets/forest_v4_assets_1.js?v=1"></script><script src="./assets/forest_v4_assets_2.js?v=1"></script><script src="./assets/forest_v4_assets_3.js?v=1"></script><script src="./assets/forest_v4_assets_4.js?v=1"></script><script src="./assets/wreck_current_layout_v1.js?v=1"></script><script src="./assets/forest_v4_integration.js?v=8-grass"></script><script src="./assets/render_resources_v1.js?v=2"></script><script src="./assets/creature_rig_math_v1.js?v=1"></script><script src="./assets/creature_motion_core_v1.js?v=1"></script><script src="./assets/creature_shadow_v1.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_profile.js?v=2"></script><script src="./assets/creature_mouth_v1.js?v=3"></script><script src="./assets/monsters/moss_beast_v3_mouth_profile.js?v=2"></script><script src="./assets/creature_head_v1.js?v=3"></script><script src="./assets/monsters/moss_beast_v3_head_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_front_quarter_head_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_back_head_profiles.js?v=1"></script><script src="./assets/creature_secondary_v1.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_secondary_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_directional_secondary_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_adapter.js?v=6"></script><script src="./assets/monsters/moss_beast_v3_quarter_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_quarter_mouth_profile.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_quarter_adapter.js?v=5"></script><script src="./assets/monsters/moss_beast_v3_axial_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_front_mouth_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_adapter.js?v=6"></script><script src="./assets/monsters/moss_beast_v3_rear_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_mouth_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_adapter.js?v=5"></script><script src="./assets/creature_direction_v1.js?v=3"></script><script src="./assets/creature_world_motion_v1.js?v=4"></script><script src="./assets/creature_life_motion_v1.js?v=2"></script><script src="./assets/battle_rules_v1.js?v=1"></script><script>'use strict';
const $=id=>document.getElementById(id),g=$('c').getContext('2d'),S=window.DungeonCreatureShadowV1,R=window.DungeonBattleRulesV1, M=window.DungeonCreatureMotionV1.create(),renderer=window.DungeonRenderResourcesV1.sharedFrames();
const sceneObjects=window.DUNGEON_WRECK_CURRENT_LAYOUT.scenes.wreck.filter(o=>o.visible&&!o.previewOnly);
window.DUNGEON_FOREST_V4_LAYOUT=window.DUNGEON_WRECK_CURRENT_LAYOUT;
const sceneArt=new Map(),sceneBg=new Image();sceneBg.src=window.DUNGEON_FOREST_V5_BACKGROUND.src;
const screenPoint=o=>({x:o.x*4.8,y:o.y*2.7});
async function loadScene(){await sceneBg.decode();await Promise.all([...new Set(sceneObjects.map(o=>o.assetId))].map(async key=>{const src=window.DUNGEON_FOREST_V4_ASSETS[key]?.src;if(!src)throw Error('missing scene asset '+key);const im=new Image();im.src=src;await im.decode();sceneArt.set(key,im);}));}
function drawSceneObject(o){const im=sceneArt.get(o.assetId),p=screenPoint(o),w=o.width*4.8,h=w*im.naturalHeight/im.naturalWidth,style=window.DungeonForestV4Integration.profile(o);g.save();g.translate(p.x,p.y);if(style.ground){g.fillStyle='rgba(18,29,21,'+Math.min(.5,style.shadowOpacity*.48)+')';g.beginPath();g.ellipse(0,0,Math.max(1,w*style.shadowWidth/200),Math.max(1,h*style.shadowHeight/200),0,0,Math.PI*2);g.fill();}g.rotate((o.rotation||0)*Math.PI/180);if(o.flip)g.scale(-1,1);if('filter'in g)g.filter='brightness('+style.brightness+') saturate('+style.saturation+') contrast('+style.contrast+')';g.drawImage(im,-w/2,-h,w,h);g.restore();}
const sortedScene=sceneObjects.slice().sort((a,b)=>a.y-b.y||a.z-b.z||a.id.localeCompare(b.id));
const adapters={side:window.DungeonMossBeastV3Adapter,quarter:window.DungeonMossBeastV3QuarterAdapter,front:window.DungeonMossBeastV3Axial.front,back:window.DungeonMossBeastV3Axial.back,rear:window.DungeonMossBeastV3RearAdapter};
const names=['正面','右前','右側','右後','背面','左後','左側','左前'],mapping=[['front',false],['quarter',true],['side',true],['rear',true],['back',false],['rear',false],['side',false],['quarter',false]],imgs=names.map((_,i)=>{const img=new Image();img.src='./assets/monsters/v3/moss_beast_v3_'+String(i*45).padStart(3,'0')+'.png';return img;});
const art={},labels={attack:'攻擊',guard:'防禦',dodge:'閃避',observe:'觀察',approach:'靠近',backstep:'拉開',retreat:'撤離'}, outcomes={victory:'擊退怪物',retreat:'已撤離',defeat:'戰敗'};
const positions=[{x:325,y:235,scale:.65},{x:325,y:216,scale:.56},{x:325,y:190,scale:.46}];
let state,hp,displayHP,displayEnemy,ready=false,busy=false,clip=null,point,angle=0,last=0,token=0,hidden=false,elapsed=0,idleAge=0;
function reset(){token++;state={enemyHp:8,maxEnemyHp:8,turn:0,intent:'pounce',distance:1,focused:false,braced:false,result:null,source:'opening'};hp=16;displayHP=hp;displayEnemy=state.enemyHp;point={...positions[1]};angle=0;hidden=false;busy=false;clip=null;idleAge=0;renderer.clear();$('feedback').textContent='牠注意到你，壓低身體。';sync();}
function sync(){$('enemy').textContent=displayEnemy+' / '+state.maxEnemyHp;$('hero').textContent=displayHP+' / 16';$('enemyBar').value=displayEnemy;$('heroBar').value=displayHP;$('intent').textContent=state.result?outcomes[state.result]:R.intents[state.intent];$('range').textContent=R.distances[state.distance]+'｜第 '+state.turn+' 回合';for(const b of $('actions').children){const a=b.dataset.action;b.disabled=!ready||busy||!!state.result||(a==='attack'&&state.distance!==0)||(a==='approach'&&state.distance===0)||(a==='backstep'&&state.distance===2);}$('reset').disabled=!ready;}
for(const [a,name] of Object.entries(labels)){const b=document.createElement('button');b.textContent=name;b.dataset.action=a;b.onclick=()=>turn(a);$('actions').append(b);}
function turn(action){if(!ready||busy||state.result)return;const result=R.resolve(state,hp,action,{slippery:$('slippery').checked});if(result.skipped)return;busy=true;sync();$('feedback').textContent='行動中：'+labels[action];const phases=[];const add=(mode,duration,to,impact,at,dir=0)=>phases.push({mode,duration,to,impact,at,dir});const next={...positions[result.state.distance]};
if(result.damage)add(result.damage>=6?'heavy-hit':'hit',result.damage>=6?900:650,null,()=>{displayEnemy=result.state.enemyHp;sync();},280);
if(result.enemyAction==='pounce')add('pounce',M.attackProfiles.pounce.end,next,()=>{displayHP=result.hp;sync();},M.attackProfiles.pounce.airEnd);
else if(result.enemyAction==='heavy')add('slam',M.attackProfiles.slam.end,next,()=>{displayHP=result.hp;sync();},M.attackProfiles.slam.airEnd);
else if(result.enemyAction==='approach')add('walk',800,next,null,0);
else if(result.enemyAction==='withdraw'){// A withdrawal is never an added hit.
 add('walk',950,{x:345,y:175,scale:.42},null,0,4);
}else add('stand',350,next,null,0);
if(result.state.result==='defeat'&&result.enemyAction==='withdraw')phases.pop();
let i=0;const currentToken=token;const nextPhase=()=>{if(currentToken!==token)return;if(i>=phases.length){state=result.state;hp=result.hp;displayHP=hp;displayEnemy=state.enemyHp;busy=false;clip=null;hidden=result.enemyAction==='withdraw'&&state.result!=='defeat';if(!state.result)point={...positions[state.distance]};$('feedback').textContent=state.feedback;sync();return;}const p=phases[i++];clip={...p,from:{...point},to:p.to?{...p.to}:{...point},age:0,doneImpact:false,finish:nextPhase};angle=p.dir;};nextPhase();}
function advance(dt){idleAge+=dt;if(!clip)return;const q=clip;q.age=Math.min(q.duration,q.age+dt);let p=q.age/q.duration;if(q.mode==='pounce'){const t=M.attackProfiles.pounce;p=Math.max(0,Math.min(1,(q.age-t.push)/(t.airEnd-t.push)));}else if(q.mode==='slam')p=0;for(const k of ['x','y','scale'])point[k]=q.from[k]+(q.to[k]-q.from[k])*p;if(!q.doneImpact&&q.age>=q.at){q.doneImpact=true;q.impact?.();}if(q.age>=q.duration){point={...q.to};q.finish();}}
function tick(now){const dt=last?Math.min(50,now-last):0;last=now;if(!document.hidden)advance(dt);g.clearRect(0,0,480,270);g.drawImage(sceneBg,0,0,480,270);for(const o of sortedScene.filter(o=>screenPoint(o).y<point.y))drawSceneObject(o);
if(!hidden){const [key,mirror]=mapping[angle],A=adapters[key],mode=clip?.mode||(state.result?'stand':state.intent==='exposed'?'stand':state.intent==='heavy'?'charge':'alert');const time=clip?clip.age:idleAge%1200;const pose=A.sample(mode,time);S.draw(g,S.calculate({x:point.x,y:point.y,height:(pose.height||0)*point.scale,width:150*point.scale,depth:10*point.scale}));g.save();g.translate(point.x,point.y);g.scale(point.scale,point.scale);g.translate(-112,-153);g.imageSmoothingEnabled=false;if(mirror){g.translate(224,0);g.scale(-1,1);}renderer.draw(g,{shareable:false,paint:ctx=>A.draw(ctx,art[key],pose)});g.restore();}
for(const o of sortedScene.filter(o=>screenPoint(o).y>=point.y))drawSceneObject(o);requestAnimationFrame(tick);}
$('reset').onclick=reset;document.addEventListener('visibilitychange',()=>{last=0;});reset();Promise.all([...imgs.map(i=>i.decode()),loadScene()]).then(()=>{for(const [k,i] of Object.entries({side:6,quarter:7,front:0,back:4,rear:5}))art[k]=adapters[k].split(imgs[i]);ready=true;sync();requestAnimationFrame(tick);}).catch(e=>{$('feedback').textContent='載入失敗：'+e.message;});
</script></html>
