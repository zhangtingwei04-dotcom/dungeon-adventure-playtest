pt src="./assets/battle_exit_v1.js?v=1"></script><script>'use strict';
const $=id=>document.getElementById(id),g=$('c').getContext('2d'),S=window.DungeonCreatureShadowV1,R=window.DungeonBattleRulesV1, M=window.DungeonCreatureMotionV1.create(),renderer=window.DungeonRenderResourcesV1.sharedFrames();

const names=['正面','右前','右側','右後','背面','左後','左側','左前'],mapping=[['front',false],['quarter',true],['side',true],['rear',true],['back',false],['rear',false],['side',false],['quarter',false]],imgs=names.map((_,i)=>{const img=new Image();img.src='./assets/monsters/v3/moss_beast_v3_'+String(i*45).padStart(3,'0')+'.png';return img;});
const D=window.DungeonCreatureDirectionV1,E=window.DungeonBattleExitV1;const art={},labels={attack:'攻擊',guard:'防禦',dodge:'閃避',observe:'觀察',approach:'靠近',backstep:'拉開',retreat:'撤離'}, outcomes={victory:'擊退怪物',retreat:'已撤離',defeat:'戰敗'};
const positions=[{x:325,y:235,scale:.65},{x:325,y:216,scale:.56},{x:325,y:190,scale:.46}];
let state,hp,displayHP,displayEnemy,ready=false,busy=false,clip=null,point,angle=0,last=0,token=0,hidden=false,elapsed=0,idleAge=0,pending=null,wildAge=-1,sceneOpacity=1,exitType='none';
function reset(){token++;state={enemyHp:8,maxEnemyHp:8,turn:0,intent:'pounce',distance:1,focused:false,braced:false,result:null,source:'opening'};hp=16;displayHP=hp;displayEnemy=state.enemyHp;point={...positions[1]};angle=0;hidden=false;busy=false;clip=null;idleAge=0;pending=null;wildAge=-1;sceneOpacity=1;exitType='none';renderer.clear();$('feedback').textContent='牠注意到你，壓低身體。';sync();}
function sync(){$('enemy').textContent=displayEnemy+' / '+state.maxEnemyHp;$('hero').textContent=displayHP+' / 16';$('enemyBar').value=displayEnemy;$('heroBar').value=displayHP;$('intent').textContent=busy?'行動演出中':state.result?outcomes[state.result]:R.intents[state.intent];$('range').textContent=R.distances[busy&&pending?pending.state.distance:state.distance]+'｜第 '+(busy&&pending?pending.state.turn:state.turn)+' 回合'+(busy?'（結算中）':'');for(const b of $('actions').children){const a=b.dataset.action;b.disabled=!ready||busy||!!state.result||(a==='attack'&&state.distance!==0)||(a==='approach'&&state.distance===0)||(a==='backstep'&&state.distance===2);}$('reset').disabled=!ready;$('demoDeath').disabled=!ready||busy;$('demoFlee').disabled=!ready||busy;}
for(const [a,name] of Object.entries(labels)){const b=document.createElement('button');b.textContent=name;b.dataset.action=a;b.onclick=()=>turn(a);$('actions').append(b);}
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n)),ease=u=>u*u*(3-2*u);
function turn(action,demo=null){
 if(!ready||busy||state.result)return;
 const result=demo?{state:{...state,enemyHp:demo==='death'?0:3,result:'victory',distance:2,turn:state.turn+1,feedback:demo==='death'?'獨立演出：怪物死亡。':'獨立演出：怪物存活並逃離。'},hp,damage:state.enemyHp-(demo==='death'?0:3),hit:0,enemyAction:'withdraw'}:R.resolve(state,hp,action,{slippery:$('slippery').checked});if(result.skipped)return;exitType=E.classify(result,{action,disposition:demo==='death'?'death':null});
 busy=true;pending=result;if(wildAge<0)wildAge=0;sync();$('feedback').textContent=demo?'獨立退場演出：'+(demo==='death'?'死亡':'逃跑'):'第 '+result.state.turn+' 回合：'+labels[action]+'。';
 const phases=[],next={...positions[result.state.distance]};
 let planned={...point},heading=angle;

 function face(dir){const route=D.plan(heading,dir,{speed:'fast'});if(route.duration){add('turn',route.duration,null,null,0,dir);phases[phases.length-1].route=route;}}

 else if(result.enemyAction==='heavy'){face(0);add('slam',M.attackProfiles.slam.end,null,hitHero,M.attackProfiles.slam.airEnd,0);}

 }else if(exitType==='death'||exitType==='player-retreat'){
  for(const p of E.plan(exitType))add(p.mode,p.duration);
 }else if(!result.state.result){
  const dist=Math.hypot(next.x-planned.x,next.y-planned.y);
  if(dist>.1){ // player-relative range changes, not an invented monster attack
   add('stand',450,next,null,0,heading);
  }
  face(0);
 }
 let i=0;const currentToken=token;
 const nextPhase=()=>{if(currentToken!==token)return;if(i>=phases.length){state=result.state;hp=result.hp;displayHP=hp;displayEnemy=state.enemyHp;busy=false;pending=null;clip=null;hidden=exitType==='flee'||exitType==='death';$('feedback').textContent=state.feedback;sync();return;}
 const p=phases[i++];clip={...p,from:{...point},to:p.to?{...p.to}:{...point},age:0,doneImpact:false,finish:nextPhase};if(!p.route)angle=p.dir;};
 nextPhase();
}
function advance(dt){
 idleAge+=dt;if(wildAge>=0)wildAge+=dt;if(!clip)return;
 const q=clip;q.age=Math.min(q.duration,q.age+dt);if(q.mode==='player-fade')sceneOpacity=E.visual(q.mode,q.age,q.duration).sceneOpacity;let p=q.age/q.duration;

 if(!q.doneImpact&&q.age>=q.at){q.doneImpact=true;q.impact?.();}

function wildlife(o){const kind=o.assetId.replace('forest4_','');if(wildAge<0||!['rabbit','bird','butterfly','beetle'].includes(kind))return o;

 const d=o.x<50?-1:1;return {...o,x:o.x+d*(kind==='beetle'?5:28)*u,y:o.y+(kind==='bird'||kind==='butterfly'?-25:kind==='beetle'?2:7)*u,escapeOpacity:kind==='beetle'?1-u:1-ease(u)};
}

if(!hidden){const [key,mirror]=mapping[angle],A=adapters[key],mode=clip?.mode||(state.result?'stand':state.intent==='exposed'?'stand':state.intent==='heavy'?'charge':'alert');const time=clip?clip.age:idleAge%1200;const visual=E.visual(mode,time,clip?.duration||1);g.save();g.globalAlpha=visual.opacity;const pose=clip?.route?(()=>{const q=D.sample(clip.route,clip.age);return D.mixPose(A.sample('stand',0),A.sample('walk',q.stepTime),q.weight);})():A.sample(visual.pose,visual.time);S.draw(g,S.calculate({x:point.x,y:point.y,height:(pose.height||0)*point.scale,width:150*point.scale,depth:10*point.scale}));g.save();g.translate(point.x,point.y);g.scale(point.scale,point.scale);g.translate(-112,-153);g.imageSmoothingEnabled=false;if(mirror){g.translate(224,0);g.scale(-1,1);}renderer.draw(g,{shareable:false,paint:ctx=>A.draw(ctx,art[key],pose)});g.restore();g.restore();}
