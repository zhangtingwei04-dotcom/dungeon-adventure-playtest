<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>苔棘鬃獸 V3 骨架候選測試</title><style>body{margin:0;padding:12px;background:#142a22;color:#e7dabb;font:15px system-ui}main{max-width:800px;margin:auto}h2{font-size:20px}canvas{display:block;width:100%;height:auto;background:#263b31;border:1px solid #92845e;border-radius:6px;image-rendering:pixelated}nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button,select{font:inherit;color:inherit;background:#2b4939;border:1px solid #9d8b5b;border-radius:5px;padding:9px}button[aria-pressed=true]{background:#b9a16d;color:#183328}label{display:inline-flex;align-items:center;gap:5px}p{line-height:1.5}small{color:#c0c4ad}</style><main><h2>苔棘鬃獸 V3.4｜八方向動態骨架候選</h2><p>新增 225° 左斜後骨架，八方向皆有動態適配（右向三個角度使用左向鏡像）。正背面先採原地投影。</p><canvas id="c" width="480" height="240"></canvas><nav id="directions"></nav><nav id="actions"></nav><nav><button id="turn">八方向轉身</button><button id="mirror">切換動態方向</button><label>動態視角 <select id="rig"><option value="side">側面</option><option value="quarter">斜前方</option><option value="front">正面</option><option value="back">背面</option><option value="rear">斜後方</option></select></label><button id="pause">暫停</button><button id="frame">下一幀</button><select id="speed"><option value=".5">半速</option><option value="1" selected>正常</option><option value="1.5">快速</option></select><label><input id="debug" type="checkbox">四腿骨架</label><label><input id="body" type="checkbox">只看軀幹</label></nav><p id="status">載入素材…</p><p id="audit">等待像素驗收…</p><small>候選版：斜前方只蒙皮三隻可見腿，遠側後腿被遮擋；正背面各有兩條可見腿，其餘遮擋；斜後方三條可見腿，遠側前腿遮擋；轉向為方向圖切換，尚非連續轉身。側面裁切與實機動畫仍需驗收。未接入正式戰鬥。</small></main>
<script src="./assets/creature_rig_math_v1.js?v=1"></script><script src="./assets/creature_motion_core_v1.js?v=1"></script><script src="./assets/creature_shadow_v1.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_profile.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_adapter.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_quarter_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_quarter_adapter.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_adapter.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_adapter.js?v=1"></script><script>
'use strict';
const $=id=>document.getElementById(id),g=$('c').getContext('2d'),sideA=window.DungeonMossBeastV3Adapter,quarterA=window.DungeonMossBeastV3QuarterAdapter,axial=window.DungeonMossBeastV3Axial,rearA=window.DungeonMossBeastV3RearAdapter,S=window.DungeonCreatureShadowV1;
const names=['正面','右前','右側','右後','背面','左後','左側','左前'],imgs=names.map((_,i)=>{const img=new Image();img.src='./assets/monsters/v3/moss_beast_v3_'+String(i*45).padStart(3,'0')+'.png';return img;});
let mode='static',angle=6,mirror=false,paused=false,t=0,last=0,art=null,quarterArt=null,A=sideA,axialArt={},rearArt=null;
const adapters={side:sideA,quarter:quarterA,front:axial.front,back:axial.back,rear:rearA};const isAxial=()=>A===axial.front||A===axial.back;const selectedArt=()=>A===sideA?art:A===quarterA?quarterArt:A===axial.front?axialArt.front:A===axial.back?axialArt.back:rearArt;
const modes={stand:'站立重組',rest:'休息',rise:'起身',walk:'原地步行',trot:'小跑',run:'疾跑',jump:'向前跳', 'jump-up':'原地跳',charge:'蓄力',pounce:'撲擊',slam:'落地重擊',hit:'輕傷','heavy-hit':'重擊',down:'倒地',recover:'起身恢復'};
function set(m){mode=m;t=0;paused=false;$('pause').textContent='暫停';}
function button(host,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$(host).append(b);}
names.forEach((n,i)=>button('directions',i*45+'° '+n,()=>{angle=i;set('static');}));Object.entries(modes).forEach(([m,n])=>button('actions',n,()=>set(m)));
$('turn').onclick=()=>set('turn');$('mirror').onclick=()=>{mirror=!mirror;};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停';};$('frame').onclick=()=>{paused=true;t+=1000/30;$('pause').textContent='繼續';};
Promise.all(imgs.map(i=>i.decode())).then(()=>{art=sideA.split(imgs[6]);quarterArt=quarterA.split(imgs[7]);axialArt.front=axial.front.split(imgs[0]);axialArt.back=axial.back.split(imgs[4]);rearArt=rearA.split(imgs[5]);updateAudit();$('status').textContent='素材已載入';requestAnimationFrame(tick);}).catch(e=>$('status').textContent='載入失敗：'+e.message);
function updateAudit(){const q=A.audit(selectedArt());$('audit').textContent='站立重組差異像素（RGB誤差>1）：'+q.different+'；軀幹獨立殘片：'+q.detachedPixels+' 像素。';}
$('rig').onchange=()=>{A=adapters[$('rig').value];$('mirror').disabled=isAxial();if(art&&quarterArt&&axialArt.front&&rearArt)updateAudit();set('stand');};
function tick(now){if(!paused)t+=Math.min(50,last?now-last:0)*Number($('speed').value);last=now;g.clearRect(0,0,480,240);g.fillStyle='#263b31';g.fillRect(0,0,480,240);g.fillStyle='#7f8a70';g.fillRect(0,213,480,1);
let x=128,s=null,idx=mode==='turn'?(angle+Math.floor(t/160))%8:angle;
if(mode!=='static'&&mode!=='turn'){s=A.sample(mode,t);x+=mirror?-s.dx:s.dx;if(!isAxial()&&(mode==='jump'||mode==='pounce'))x+=mirror?-45:45;}
S.draw(g,S.calculate({x:x+112,y:213,height:s?.height||0,width:150,depth:10}));g.save();g.translate(x,60);g.imageSmoothingEnabled=false;if(s){if(mirror&&!isAxial()){g.translate(224,0);g.scale(-1,1);}A.draw(g,selectedArt(),s,{debug:$('debug').checked,bodyOnly:$('body').checked});}else g.drawImage(imgs[idx],0,0);g.restore();
$('status').textContent=s?modes[mode]+' · '+s.stage+' · '+(A===sideA?'側面':A===quarterA?'斜前方':A===axial.front?'正面':A===axial.back?'背面':'斜後方')+'・'+(isAxial()?'原地投影':mirror?'右向鏡像':'左向骨架'):'方向 '+idx*45+'° '+names[idx];requestAnimationFrame(tick);}
</script></html>
