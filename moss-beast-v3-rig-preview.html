<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>苔棘鬃獸 V3 骨架候選測試</title><style>body{margin:0;padding:12px;background:#142a22;color:#e7dabb;font:15px system-ui}main{max-width:800px;margin:auto}h2{font-size:20px}canvas{display:block;width:100%;height:auto;background:#263b31;border:1px solid #92845e;border-radius:6px;image-rendering:pixelated}nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button,select{font:inherit;color:inherit;background:#2b4939;border:1px solid #9d8b5b;border-radius:5px;padding:9px}button[aria-pressed=true]{background:#b9a16d;color:#183328}label{display:inline-flex;align-items:center;gap:5px}p{line-height:1.5}small{color:#c0c4ad}</style><main><h2>苔棘鬃獸 V3.5｜八方向踏步轉向</h2><p>共用八方向轉向：選擇目標方向，再測試原地轉身或步態中轉向。右向三個角度使用鏡像骨架。</p><canvas id="c" width="480" height="240"></canvas><nav id="directions"></nav><nav id="actions"></nav><nav><label>目標方向 <select id="target"></select></label><label>轉身速度 <select id="turn-speed"><option value="slow">緩慢</option><option value="alert" selected>警戒</option><option value="fast">快速</option></select></label><button id="turn">轉向目標</button><button id="full-turn">完整轉身一圈</button><button id="mirror">切換動態方向</button><label>動態視角 <select id="rig"><option value="side">側面</option><option value="quarter">斜前方</option><option value="front">正面</option><option value="back">背面</option><option value="rear">斜後方</option></select></label><button id="pause">暫停</button><button id="frame">下一幀</button><select id="speed"><option value=".5">半速</option><option value="1" selected>正常</option><option value="1.5">快速</option></select><label><input id="debug" type="checkbox">顯示可見腿骨架</label><label><input id="body" type="checkbox">只看軀幹</label></nav><p id="status">載入素材…</p><p id="audit">等待像素驗收…</p><small>候選版：斜前方只蒙皮三隻可見腿，遠側後腿被遮擋；正背面各有兩條可見腿，其餘遮擋；斜後方三條可見腿，遠側前腿遮擋；轉向已串聯骨架踏步，方向仍以45°離散切換；不是3D旋轉或逐角度姿態混合。側面裁切與實機動畫仍需驗收。未接入正式戰鬥。</small></main>
<script src="./assets/creature_rig_math_v1.js?v=1"></script><script src="./assets/creature_motion_core_v1.js?v=1"></script><script src="./assets/creature_shadow_v1.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_profile.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_adapter.js?v=2"></script><script src="./assets/monsters/moss_beast_v3_quarter_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_quarter_adapter.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_profiles.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_axial_adapter.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_profile.js?v=1"></script><script src="./assets/monsters/moss_beast_v3_rear_adapter.js?v=1"></script><script src="./assets/creature_direction_v1.js?v=1"></script><script>
'use strict';
const $=id=>document.getElementById(id),g=$('c').getContext('2d'),S=window.DungeonCreatureShadowV1,D=window.DungeonCreatureDirectionV1;
const adapters={side:window.DungeonMossBeastV3Adapter,quarter:window.DungeonMossBeastV3QuarterAdapter,front:window.DungeonMossBeastV3Axial.front,back:window.DungeonMossBeastV3Axial.back,rear:window.DungeonMossBeastV3RearAdapter};
const names=['正面','右前','右側','右後','背面','左後','左側','左前'],mapping=[['front',false],['quarter',true],['side',true],['rear',true],['back',false],['rear',false],['side',false],['quarter',false]],imgs=names.map((_,i)=>{const img=new Image();img.src='./assets/monsters/v3/moss_beast_v3_'+String(i*45).padStart(3,'0')+'.png';return img;});
const art={},audit={};let mode='static',angle=6,paused=false,t=0,last=0,turn=null,ready=false;
const modes={stand:'站立重組',rest:'休息',rise:'起身',walk:'原地步行',trot:'小跑',run:'疾跑',jump:'向前跳','jump-up':'原地跳',charge:'蓄力',pounce:'撲擊',slam:'落地重擊',hit:'輕傷','heavy-hit':'重擊',down:'倒地',recover:'起身恢復'};
const moving=()=>['walk','trot','run'].includes(mode),axial=()=>angle===0||angle===4;
function syncDirection(){const [key]=mapping[angle];$('rig').value=key;$('mirror').disabled=axial();if(ready){const q=audit[key];$('audit').textContent='站立重組差異像素（RGB誤差>1）：'+q.different+'；軀幹獨立殘片：'+q.detachedPixels+' 像素。';}}
function set(m){turn=null;mode=m;t=0;paused=false;$('pause').textContent='暫停';}
function choose(i){angle=i;syncDirection();set('static');}
function button(host,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$(host).append(b);}
names.forEach((n,i)=>{button('directions',i*45+'° '+n,()=>choose(i));const o=document.createElement('option');o.value=i;o.textContent=i*45+'° '+n;$('target').append(o);});$('target').value='2';
Object.entries(modes).forEach(([m,n])=>button('actions',n,()=>set(m)));
function begin(full=false){
 if(!ready)return;const route=D.plan(angle,full?angle:Number($('target').value),{speed:$('turn-speed').value,full});
 if(!route.duration){turn=null;return;}
 const carry=moving();if(!carry){mode='turn-step';t=0;}
 turn={route,elapsed:0,carry};paused=false;$('pause').textContent='暫停';
}
$('turn').onclick=()=>begin(false);$('full-turn').onclick=()=>begin(true);
$('mirror').onclick=()=>{if(axial())return;angle=(8-angle)%8;turn=null;if(mode==='turn-step')mode='stand';syncDirection();};
$('rig').onchange=()=>{const key=$('rig').value,mirror=mapping[angle][1];angle=mapping.findIndex(q=>q[0]===key&&q[1]===(key==='front'||key==='back'?false:mirror));syncDirection();set('stand');};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續':'暫停';};
function advance(dt){t+=dt;if(turn){turn.elapsed+=dt;const q=D.sample(turn.route,turn.elapsed);if(angle!==q.direction){angle=q.direction;syncDirection();}if(q.done){const carry=turn.carry;turn=null;if(!carry){mode='stand';t=0;}}}}
$('frame').onclick=()=>{paused=true;advance(1000/30);$('pause').textContent='繼續';};
Promise.all(imgs.map(i=>i.decode())).then(()=>{for(const [key,i] of Object.entries({side:6,quarter:7,front:0,back:4,rear:5})){art[key]=adapters[key].split(imgs[i]);audit[key]=adapters[key].audit(art[key]);}ready=true;syncDirection();requestAnimationFrame(tick);}).catch(e=>$('status').textContent='載入失敗：'+e.message);
function tick(now){if(!paused)advance(Math.min(50,last?now-last:0)*Number($('speed').value));last=now;g.clearRect(0,0,480,240);g.fillStyle='#263b31';g.fillRect(0,0,480,240);g.fillStyle='#7f8a70';g.fillRect(0,213,480,1);
const [key,mirror]=mapping[angle],A=adapters[key];let x=128,s=null,q=turn?D.sample(turn.route,turn.elapsed):null;
if(mode==='turn-step'&&q){s=D.mixPose(A.sample('stand',0),A.sample('walk',q.stepTime),q.weight);}
else if(mode!=='static'){s=A.sample(mode,t);x+=mirror?-s.dx:s.dx;if(!axial()&&(mode==='jump'||mode==='pounce'))x+=mirror?-45:45;}
S.draw(g,S.calculate({x:x+112,y:213,height:s?.height||0,width:150,depth:10}));g.save();g.translate(x,60);g.imageSmoothingEnabled=false;if(s){if(mirror){g.translate(224,0);g.scale(-1,1);}A.draw(g,art[key],s,{debug:$('debug').checked,bodyOnly:$('body').checked});}else g.drawImage(imgs[angle],0,0);g.restore();
$('status').textContent=q?(turn.carry?'步態中轉向':'原地踏步轉向')+'・'+Math.round(q.progress*100)+'%・'+names[angle]+'・目標 '+names[turn.route.to]:s?(modes[mode]||mode)+'・'+s.stage+'・'+names[angle]+(mirror?'（鏡像）':''):'方向 '+angle*45+'° '+names[angle];requestAnimationFrame(tick);}
</script></html>
