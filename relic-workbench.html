<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>遺物研究工作台 V1.0</title><style>
:root{color-scheme:dark;background:#141b19;color:#ede8d9;font:14px/1.5 system-ui}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:10px 14px}h1,h2{color:#dbbd7c;margin:0 0 8px}h1{font-size:19px}h2{font-size:16px}main{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}section{background:#202b26;border:1px solid #62624b;padding:12px;border-radius:8px;min-width:0}button,select,input{font:inherit;background:#152019;color:#e8dbb4;border:1px solid #77765c;border-radius:5px;min-height:36px;padding:5px 8px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4}small{color:#b9c3b6}p{margin:7px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}input[type=number]{width:75px}.gold{color:#dbbd7c}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#141b19;padding:8px;border-radius:6px;font-size:12px}select{max-width:100%}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header><h1>遺物研究工作台 V1.0</h1><small>獨立原型｜測試樣本並非正式道具｜重新整理清除，不改遊戲存檔</small></header><main><section><h2>01 御心者與遺物研究</h2><label>測試相性 <select id="profile"><option value="link">影＋續</option><option value="residue">餘</option></select></label><p id="actor" class="gold"></p><label>研究對象 <select id="relic"></select></label><div class="actions"><button id="research">模擬鑑定</button><button id="equip">裝備</button><button id="unequip">卸下</button><button id="modify">一次性天資改質</button></div><p>目前已知資料</p><pre id="known"></pre><small>切換相性只供測試相容性；不代表正式遊戲允許隨意轉換相性。鑑定按鈕僅模擬已完成的研究。</small></section><section><h2>02 能量與外部媒介</h2><p id="energy" class="gold"></p><label>心火量 <input id="units" type="number" min="1" max="100" value="10"></label><div class="actions"><button id="deposit">存入心火</button><button id="withdraw">取出心火</button><button id="external">模擬外部能量輸入</button><button id="supply">模擬燈獸核心供能</button></div><p id="status" role="status"></p><small>外部能量輸入只是測試事件；正式遊戲須核實並扣除外部來源，不能無限點擊產能。燈獸尚未生成或接入。</small><div class="actions"><button id="reset">重置獨立測試</button></div></section></main><script src="assets/engine_foundation_v1.js"></script><script src="assets/mind_core_v1.js"></script><script src="assets/mind_growth_v1.js"></script><script src="assets/relic_core_v1.js"></script><script>
(()=>{'use strict';const c=window.DungeonMindCoreV1,g=window.DungeonMindGrowthV1,r=window.DungeonRelicCoreV1,$=id=>document.getElementById(id);if(!r){$('status').textContent='核心載入失敗';return}const profiles={link:c.createProfile({schoolId:'school-6-0',main:'續',phases:['續','影']}),residue:c.createProfile({schoolId:'school-3-0',main:'餘',phases:['餘']})};let state,actor;const p=()=>profiles[$('profile').value],id=()=>$('relic').value,units=()=>$('units').valueAsNumber;
function reset(){state=r.create();actor=g.create(Object.fromEntries(g.stats.map(k=>[k,11])));for(const d of r.catalog)state=r.acquire(state,d.id,d.id,d.id==='demo-crystal'?20:0);$('relic').replaceChildren(...state.items.map((x,i)=>{const opt=document.createElement('option');opt.value=x.id;opt.textContent='未鑑定樣本 '+(i+1);return opt}));$('relic').value='demo-ring';render()}
function render(){const i=state.items.find(x=>x.id===id()),v=r.visible(state,id()),e=r.effective(state,p(),actor);for(const o of $('relic').options){const x=state.items.find(i=>i.id===o.value),info=r.visible(state,x.id);o.textContent=x.consumed?'已消耗樣本 '+(state.items.indexOf(x)+1):info?.name||'未鑑定樣本 '+(state.items.indexOf(x)+1)}$('known').textContent=v?JSON.stringify(v,null,2):'此遺物已消耗';$('actor').textContent='心火 '+actor.energy+' / '+actor.abilities.capacity+'｜控制天資 '+actor.innate.control+' + '+actor.modifiers.control+'｜回復 '+e.values.recovery+'（加成 '+e.bonuses.recovery+'）';$('energy').textContent='遺物儲能：'+(v?.energy?v.energy.stored+' / '+v.energy.capacity:'尚未鑑定或已消耗');$('research').disabled=!!i?.consumed}
const msg={NOT_OWNED:'遺物不存在或已消耗',NOT_EQUIPPABLE:'不屬於可裝備增幅遺物',INCOMPATIBLE_PHASE:'相性不符',INCOMPATIBLE_STORAGE:'不相容或無儲能能力',INSUFFICIENT_OR_FULL:'心火不足或容量已滿',INCOMPATIBLE_OR_NO_MODIFIER:'相性不符或無改質能力',NO_EXTERNAL_INPUT:'沒有外部能量接收能力',INSUFFICIENT_OR_NO_ANCHOR:'缺乏燈獸核心能力或儲能不足'};
function act(fn){try{const x=fn();if(x?.ok===false){$('status').textContent=msg[x.reason]||x.reason;return}if(x?.state)state=x.state;if(x?.actor)actor=x.actor;$('status').textContent=x?.message||'完成';render()}catch(e){$('status').textContent=e.message}}
$('profile').onchange=render;$('relic').onchange=render;
$('research').onclick=()=>act(()=>({state:r.research(state,id(),r.fields),message:'研究資料已解鎖'}));
$('equip').onclick=()=>act(()=>r.equip(state,id(),p()));$('unequip').onclick=()=>act(()=>({state:r.unequip(state,id())}));$('modify').onclick=()=>act(()=>r.modify(state,id(),p(),actor));
$('deposit').onclick=()=>act(()=>r.transfer(state,id(),p(),actor,units(),'deposit'));$('withdraw').onclick=()=>act(()=>r.transfer(state,id(),p(),actor,units(),'withdraw'));$('external').onclick=()=>act(()=>{const x=r.receiveExternal(state,id(),units());return {...x,message:'外部輸入 '+x.input+'｜儲存 '+x.added+'｜損耗 '+x.loss}});$('supply').onclick=()=>act(()=>{const x=r.supply(state,id(),units());return {...x,message:'獨立媒介供出 '+x.supplied+' 點心火（未生成燈獸）'}});$('reset').onclick=()=>{reset();$('status').textContent='已重置'};reset()})();
</script></body></html>
