<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>燈獸生命工作台 V1.0</title><style>
:root{color-scheme:dark;background:#141b19;color:#ede8d9;font:14px/1.5 system-ui}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:10px 14px}h1,h2{color:#dbbd7c;margin:0 0 8px}h1{font-size:19px}h2{font-size:16px}main{display:grid;grid-template-columns:1fr 1.2fr;gap:10px}section{background:#202b26;border:1px solid #62624b;padding:12px;border-radius:8px;min-width:0}button,select,input{font:inherit;background:#152019;color:#e8dbb4;border:1px solid #77765c;border-radius:5px;min-height:36px;padding:5px 8px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4}small{color:#b9c3b6}p{margin:7px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.gold{color:#dbbd7c}article{border-top:1px solid #566259;padding:8px 0}progress{width:100%;height:10px;accent-color:#c5a154}@media(max-width:600px){main{grid-template-columns:1fr}}</style></head><body><header><h1>燈獸生命工作台 V1.0</h1><small>獨立生命週期原型｜無正式場景、動畫或存檔接入</small></header><main><section><h2>01 供能比較</h2><p id="owner" class="gold"></p><p id="anchors"></p><label><input id="present" type="checkbox" checked> 主人可供能</label><div class="actions"><button id="tick">下一回合</button><button id="feed">模擬外部輸入 25</button><button id="reset">重置三種燈獸</button></div><div id="beasts"></div><small>初始構築每隻耗用主人5點；每回合維持5點。外部輸入轉換80%，必須由正式世界能源事件驗證，這裡僅模擬。</small></section><section><h2>02 生命狀態測試</h2><label>選擇燈獸 <select id="target"><option value="ordinary">普通型</option><option value="hosted">寄宿型</option><option value="permanent">永久型</option></select></label><div class="actions"><button id="body">形體受損 50</button><button id="core">核心受損 25</button><button id="repair">模擬修復</button><button id="wake">喚醒</button></div><h2>03 意志覺醒測試</h2><div class="actions"><button id="awaken">模擬覺醒事件</button><button id="recover">自身休息30分鐘</button><button id="leave">模擬自主離開</button></div><p id="status" role="status"></p><small>修復、覺醒及離開是獨立測試事件，不代表正式玩家可直接命令。覺醒不補滿心火；原型仍以核心完整度約束生命，正式死亡與覺醒條件待確認。</small></section></main><script src="assets/engine_foundation_v1.js"></script><script src="assets/mind_core_v1.js"></script><script src="assets/mind_growth_v1.js"></script><script src="assets/relic_core_v1.js"></script><script src="assets/lantern_beast_v1.js"></script><script>
(()=>{'use strict';const c=window.DungeonMindCoreV1,g=window.DungeonMindGrowthV1,r=window.DungeonRelicCoreV1,b=window.DungeonLanternBeastV1,$=id=>document.getElementById(id);if(!b){$('status').textContent='核心載入失敗';return}
const labels={ordinary:'普通型',hosted:'寄宿型',permanent:'永久型',active:'活動',dormant:'休眠',collapsed:'形體崩潰',dispersed:'消散',destroyed:'核心毀滅',maintained:'已供能'},names={ordinary:'影狼',hosted:'寄宿影狼',permanent:'白夜之狼'};let state;const talents=Object.fromEntries(g.stats.map(k=>[k,11]));let p=c.createProfile({schoolId:'school-4-0',main:'影',phases:['影','續']});p=c.observe(p,'wolf');p=c.createSkill(p,{id:'wolf',name:'狼形',materials:['wolf'],allocations:[{phase:'影',branch:'形',share:60},{phase:'續',branch:'循',share:40}]});
function reset(){let relics=r.acquire(r.create(),'demo-dormant-anchor','finite',20);relics=r.acquire(relics,'demo-core','external',0);state=b.create(g.create(talents),relics);for(const [type,anchorId] of [['ordinary',null],['hosted','finite'],['permanent','external']]){const x=b.createBeast(state,p,{id:type,name:names[type],type,anchorId,skillId:'wolf'});if(!x.ok)throw Error(x.reason);state=x.state}state=b.supplyExternal(state,'permanent',50).state;$('present').checked=true;render()}
function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e)}
function render(){$('owner').textContent='主人心火 '+state.owner.energy+' / '+state.owner.abilities.capacity+'｜回合 '+state.turn;$('anchors').textContent='寄宿核心 '+state.relics.items[0].energy+' / 60｜永久核心 '+state.relics.items[1].energy+' / 100';const host=$('beasts');host.replaceChildren();for(const x of state.beasts){const row=document.createElement('article');text(row,'strong',x.name+'｜'+labels[x.type]+'｜'+labels[x.status]);text(row,'p','形體 '+x.body+' / 100｜核心 '+(x.type==='ordinary'?'無':x.integrity+' / 100'));const bar=document.createElement('progress');bar.max=100;bar.value=x.body;row.append(bar);text(row,'small',x.awakened?'已覺醒｜自身心火 '+x.self.energy+' / '+x.self.abilities.capacity+'｜'+(x.companion?'選擇陪伴':'選擇離開'):'尚未覺醒｜'+(x.type==='ordinary'?'主人供能':x.type==='hosted'?'有限遺物儲能':'外部能量轉換'));host.append(row)}}
const msgs={INVALID_DAMAGE:'此狀態無法受損或沒有核心',REPAIR_NOT_AVAILABLE:'不可修復已消散或毀滅的燈獸',CANNOT_WAKE:'必須先處於可喚醒的休眠狀態',NO_ENERGY:'能源不足',AWAKENING_NOT_AVAILABLE:'不符合測試覺醒條件',NO_SELF_HEARTFIRE:'尚未覺醒或已毀滅',INDEPENDENT_CHOICE_REQUIRED:'需要獨立意志的選擇',NO_EXTERNAL_ANCHOR:'此燈獸不使用外部供能'};
function act(fn){try{const x=fn();if(x.ok===false){$('status').textContent=msgs[x.reason]||x.reason;return}state=x.state;$('status').textContent=x.message||x.events?.map(e=>names[e.id]+'：'+labels[e.type]).join('；')||'完成';render()}catch(e){$('status').textContent=e.message}}
const id=()=>$('target').value;$('tick').onclick=()=>act(()=>b.tick(state,{ownerAvailable:$('present').checked}));$('feed').onclick=()=>act(()=>{const x=b.supplyExternal(state,'permanent',25);return {...x,message:'外部輸入25｜儲存 '+x.added+'｜損耗 '+x.loss}});$('body').onclick=()=>act(()=>b.damage(state,id(),{body:50}));$('core').onclick=()=>act(()=>b.damage(state,id(),{core:25}));$('repair').onclick=()=>act(()=>b.repair(state,id(),{body:50,core:id()==='ordinary'?0:25,approved:true}));$('wake').onclick=()=>act(()=>b.wake(state,id()));$('awaken').onclick=()=>act(()=>b.awaken(state,id(),{approved:true,talents}));$('recover').onclick=()=>act(()=>b.recoverSelf(state,id(),30,{mode:'rest'}));$('leave').onclick=()=>act(()=>b.chooseCompanion(state,id(),false,{approved:true}));$('reset').onclick=()=>{reset();$('status').textContent='已重置'};reset()})();
</script></body></html>
