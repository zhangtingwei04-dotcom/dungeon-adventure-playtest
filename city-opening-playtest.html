a{color:#e3c88f}

.window-motion{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
  clip-path:polygon(47.4% 14.4%,64.3% 14.4%,64.3% 20.6%,69% 20.6%,69% 14.4%,76.3% 14.4%,79.7% 38.8%,75% 38.8%,72% 25.2%,69% 38.8%,20.8% 38.8%,29% 33%,37% 28%,44% 23%);

  mask-composite:intersect;
}
.window-sky-base,.window-cloud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.window-cloud{filter:blur(.22px);opacity:.84;animation:window-cloud-drift 42s -20s linear infinite}
.window-bird{position:absolute;left:0;pointer-events:none}
.window-bird{top:29%;width:6%;height:6%;animation:window-bird-pass 26s -3s linear infinite}
.window-bird::before,.window-bird::after{
  content:'';position:absolute;bottom:30%;width:48%;height:42%;
  border-top:1px solid #36302a;border-radius:55% 55% 0 0;
  animation:window-bird-wing .32s ease-in-out infinite alternate;
}
.window-bird::before{left:0;transform-origin:right center}
.window-bird::after{right:0;transform-origin:left center;animation-direction:alternate-reverse}
@keyframes window-cloud-drift{
  0%{transform:translateX(-44%);opacity:0}
  16%{opacity:.84}
  82%{opacity:.84}
  100%{transform:translateX(22%);opacity:0}
}
@keyframes window-bird-pass{
  0%,74%{left:15%;opacity:0}
  75%{left:15%;opacity:1}
  91%,100%{left:83%;top:20%;opacity:1}
}
@keyframes window-bird-wing{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
@media(prefers-reduced-motion:reduce){
  .window-cloud{animation:none}
  .window-bird,.window-bird::before,.window-bird::after{animation:none}

}

  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
