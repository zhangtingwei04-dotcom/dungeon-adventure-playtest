(()=>{'use strict';const c=window.DungeonCityOpeningV1,t=window.DungeonGameTimeV1,$=id=>document.getElementById(id);let a=c.create(),selected=null;function btn(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b}function render(){const room=a.scene==='rental-room';$('scene').dataset.scene=a.scene;$('clock').textContent=t.format(a.worldMinutes);$('place').textContent=room?'城鎮出租屋':'城鎮街道';$('description').textContent=room?'住宅區・私人房間':'住宅區・街道';$('clothes').textContent=(c.ready(a)?'白色布衣、旅行褲、鞋子':'室內衣著')+(a.equipmentV1.bag?'；已配戴側包、披風與手套':'');$('notice').textContent=a.flags.noticeRead?'校方通知已讀；待後續報到安排。':'可查看桌上的校方通知。';$('log').replaceChildren();for(const e of [...a.travelLog].reverse()){const d=document.createElement('div');d.className='entry';const p=document.createElement('div');p.textContent=e.message;const m=document.createElement('small');m.textContent=e.thought||t.format(e.worldMinute);d.append(p,m);$('log').append(d)}$('targets').replaceChildren();for(const o of room?c.objects:[{id:'return',name:'返回出租屋',x:17,y:62}]){const b=btn(o.name,()=>{selected=o.id;$('status').textContent='';render()});b.className='spot';b.style.left=o.x+'%';b.style.top=o.y+'%';b.setAttribute('aria-pressed',String(selected===o.id));$('targets').append(b)}const v=c.inspect(a,selected);$('choices').replaceChildren();if(v){$('dialogTitle').textContent=room?c.objects.find(o=>o.id===selected)?.name:'返回出租屋';$('dialogText').textContent=v.text;for(const [key,label] of v.actions)$('choices').append(btn(label,()=>{const x=c.act(a,selected,key);$('status').textContent=x.ok?x.message+(x.minutes?'（'+x.minutes+'分鐘）':''):x.reason;if(x.ok&&['leave','return'].includes(key))selected=null;render()}))}else{$('dialogTitle').textContent=room?'出租屋':'住宅區街道';$('dialogText').textContent=room?'你記得自己是受軍校安排來到這座城鎮。今天先安頓生活。':'街坊正開始一天的生活。此版先開放返回出租屋。'}}$('reset').onclick=()=>{if(confirm('重新開始獨立開場測試？')){a=c.create();selected=null;$('status').textContent='';render()}};render()})();
