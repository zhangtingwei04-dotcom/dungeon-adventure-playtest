<script>
(function(){
 const panel=document.getElementById('layoutEditor'), quick=document.getElementById('layoutQuick');
 const scene=document.getElementById('scene');
 function sync(){
  const room=scene.dataset.scene==='rental-room';
  quick.hidden=!room;
  if(!room) panel.open=false;
  quick.textContent=panel.open?'結束調整':'家具調整';
  quick.setAttribute('aria-expanded',String(panel.open));
 }
 quick.onclick=()=>{if(!panel.hidden){panel.open=!panel.open;window.scrollTo(0,0);sync();}};
 panel.addEventListener('toggle',()=>{sync();if(panel.open)window.scrollTo(0,0);});
 new MutationObserver(sync).observe(scene,{attributes:true,attributeFilter:['data-scene']});
 const params=new URLSearchParams(location.search);
 if(params.get('layout')==='1' && scene.dataset.scene==='rental-room'){
  const picker=document.getElementById('layoutItem');
  const requested=params.get('item')||'chest';
  if(Array.from(picker.options).some(option=>option.value===requested)){
   picker.value=requested;
   picker.dispatchEvent(new Event('change'));
  }
  panel.open=true;
  window.scrollTo(0,0);
 }
 sync();
})();
</script>
<div class="orientation"><div><strong>請將手機轉為橫向</strong><p>城鎮住宅以橫式畫面呈現。</p></div></div>
